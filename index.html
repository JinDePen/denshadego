const PLAT_LEN = 220, PLAT_H = 1.10, PLAT_EDGE = 1.68;
// ホームドア layout, in metres from the stop point (g): one 2.6 m opening per
// E235 door (4 per 20 m car, 11 cars), solid 戸袋 cabinets in between.
const GATE_H = 1.30, GATE_OPEN = 1.3;
const DOOR_G = [];
for (let c=10; c>=0; c--) for (const d of [17.3, 12.6, 7.9, 3.2]) DOOR_G.push(-(c*20 + d));
const GATE_CABS = [];
{ let g = -PLAT_LEN - 4;
  for (const d of DOOR_G) { GATE_CABS.push([g, d-GATE_OPEN]); g = d+GATE_OPEN; }
  GATE_CABS.push([g, 26]); }

// A standing passenger, drawn in screen space at their projected feet.
function drawPerson(x, z, h, r) {
  const p = CAM.project(x, PLAT_H, z), s = p.s;
  if (s < 2.5) return;
  const coat = [[38,42,56],[54,44,48],[36,50,52],[150,146,138],[70,72,78],[120,60,52]][(r*61|0)%6];
  const legs = [[30,32,38],[46,48,56],[70,64,58]][(r*23|0)%3];
  const lw = 0.13*s, tw = 0.44*s, leg = 0.46*h*s, tor = 0.36*h*s, hr = 0.105*s;
  X.fillStyle = haze(z, legs[0], legs[1], legs[2]);
  X.fillRect(p.x - tw*0.34, p.y - leg, lw, leg);
  X.fillRect(p.x + tw*0.34 - lw, p.y - leg, lw, leg);
  X.fillStyle = haze(z, 24, 24, 26);                                       // shoes
  X.fillRect(p.x - tw*0.36, p.y - 0.05*s, tw*0.72, 0.05*s);
  const ty = p.y - leg - tor;
  X.fillStyle = haze(z, coat[0], coat[1], coat[2]);
  rrect(p.x - tw/2, ty, tw, tor + 0.06*s, 0.08*s); X.fill();
  X.fillStyle = 'rgba(0,0,0,0.18)';                                        // shaded side
  X.fillRect(p.x + tw*0.12, ty + 0.06*s, tw*0.38, tor);
  if (r > 0.55) {                                                          // shoulder bag
    X.fillStyle = haze(z, 40, 34, 30);
    X.fillRect(p.x + tw*0.42, ty + tor*0.55, 0.16*s, 0.2*s);
  }
  X.fillStyle = haze(z, 206, 168, 140);                                    // face
  X.beginPath(); X.arc(p.x, ty - hr*0.95, hr, 0, Math.PI*2); X.fill();
  X.fillStyle = haze(z, 30, 26, 24);                                       // hair
  X.beginPath(); X.arc(p.x, ty - hr*1.1, hr*1.02, Math.PI*1.02, Math.PI*1.98); X.fill();
}

// Square-on boards hang from the canopy, so their screen footprint is a plain
// rectangle; returns it (with pixels-per-metre) after drawing the hanger rods.
function hangBoard(side, inner, ROOF, x1, x2, yB, yT, z) {
  const xa = inner+side*x1, xb = inner+side*x2;
  for (const t of [0.15, 0.85]) face(xa+(xb-xa)*t-0.02, xa+(xb-xa)*t+0.02, yT, ROOF, z, haze(z, 70, 74, 78));
  const p = CAM.project(Math.min(xa,xb), yT, z), q = CAM.project(Math.max(xa,xb), yB, z);
  return {x: p.x, y: p.y, w: q.x-p.x, h: q.y-p.y, s: p.s};
}
// Text that would fall below a legible size is drawn as a grey bar, the way
// distant lettering actually reads, instead of a blurred smudge.
function boardText(str, x, y, fs, font, col, bar, align) {
  if (fs >= 6) { text(str, x, y, `${font} ${Math.floor(fs)}px ${JP}`, col, align); return; }
  const w = str.length*fs*(/[^\x00-\x7f]/.test(str) ? 1 : 0.6);
  X.fillStyle = bar;
  X.fillRect(align==='center' ? x-w/2 : align==='right' ? x-w : x, y-fs*0.3, w, Math.max(0.6, fs*0.6));
}

function drawNameBoard(st, side, inner, ROOF, z) {
  if (z < CAM.NEAR) return;
  const b = hangBoard(side, inner, ROOF, 0.45, 3.25, ROOF-1.2, ROOF-0.45, z);
  if (b.w < 3) return;
  const s = b.s, m = 0.03*s, cx = b.x + b.w/2;
  X.fillStyle = haze(z, 70, 74, 78); X.fillRect(b.x, b.y, b.w, b.h);
  X.fillStyle = haze(z, 246, 247, 244); X.fillRect(b.x+m, b.y+m, b.w-2*m, b.h-2*m);
  X.fillStyle = haze(z, 128, 184, 56); X.fillRect(b.x+m, b.y+b.h*0.70, b.w-2*m, b.h*0.22);
  X.textBaseline = 'middle';
  boardText(st.name, cx, b.y+b.h*0.30, 0.27*s, 'bold', haze(z, 22, 30, 42), haze(z, 120, 126, 134), 'center');
  boardText(st.nameEn, cx, b.y+b.h*0.57, 0.085*s, '', haze(z, 60, 70, 86), haze(z, 190, 194, 198), 'center');
  // neighbouring stations in the green band: travel direction on the right
  const prev = STATIONS[(st.id + (side<0 ? STATIONS.length-1 : 1)) % STATIONS.length].name;
  const next = STATIONS[(st.id + (side<0 ? 1 : STATIONS.length-1)) % STATIONS.length].name;
  const by = b.y+b.h*0.81, fs = 0.095*s;
  boardText(prev, b.x+b.w*0.06, by, fs, '', '#fff', 'rgba(255,255,255,0.6)', 'left');
  boardText(next, b.x+b.w*0.94, by, fs, '', '#fff', 'rgba(255,255,255,0.6)', 'right');
  if (fs >= 6) text('▶', cx, by, `${Math.floor(fs)}px ${JP}`, '#fff', 'center');
  X.textBaseline = 'alphabetic';
}

// LED 発車標: next two departures from this platform.
const HUBS = ['品川', '渋谷', '新宿', '池袋', '上野', '東京'];
function drawDepartureBoard(st, side, inner, ROOF, z) {
  if (z < CAM.NEAR) return;
  const b = hangBoard(side, inner, ROOF, 0.35, 2.95, ROOF-1.0, ROOF-0.4, z);
  if (b.w < 3) return;
  const s = b.s;
  X.fillStyle = haze(z, 40, 42, 46); X.fillRect(b.x, b.y, b.w, b.h);
  X.fillStyle = '#0b0c0e'; X.fillRect(b.x+0.04*s, b.y+0.04*s, b.w-0.08*s, b.h-0.08*s);
  // the next two hubs in the direction this platform's trains run
  const dest = [];
  for (let k=1; dest.length<2 && k<STATIONS.length; k++) {
    const id = (st.id + (side<0 ? k : STATIONS.length-k)) % STATIONS.length;
    if (HUBS.includes(STATIONS[id].name)) dest.push(STATIONS[id].name);
  }
  const t0 = side<0 ? stationDueTime(st.id) + st.stopTime : stationDueTime(st.id) + 130;
  const fs = 0.12*s;
  X.textBaseline = 'middle';
  for (let row=0; row<2; row++) {
    const y = b.y + b.h*(0.32 + row*0.38);
    const tm = clockTime(t0 + row*240).slice(0,5);
    boardText(row ? '次発' : '先発', b.x+b.w*0.05, y, fs, '', '#e8e8e0', 'rgba(220,220,210,0.5)', 'left');
    boardText(tm, b.x+b.w*0.25, y, fs, '', '#ff9a2e', 'rgba(255,154,46,0.55)', 'left');
    boardText(dest.join('・') + '方面', b.x+b.w*0.47, y, fs, '', '#ff9a2e', 'rgba(255,154,46,0.55)', 'left');
    boardText('11両', b.x+b.w*0.95, y, fs, '', '#7ce06a', 'rgba(124,224,106,0.55)', 'right');
  }
  X.textBaseline = 'alphabetic';
}

// 停止位置目標: stands just behind the ホームドア line, board raised clear of the cabinets.
function drawStopMarker(zStop) {
  const base = CAM.project(-2.25, PLAT_H, zStop), s = base.s;
  const top = CAM.project(-2.25, 2.6, zStop);
  X.fillStyle = '#d8d8d4';
  X.fillRect(base.x-0.05*s, top.y, Math.max(1,0.10*s), base.y-top.y);
  const c = CAM.project(-2.25, 2.85, zStop), bw = Math.max(4,0.75*s), bh = Math.max(4,0.75*s);
  X.fillStyle = '#c8102e'; X.fillRect(c.x-bw/2, c.y-bh/2, bw, bh);
  X.fillStyle = '#fff';    X.fillRect(c.x-bw/2, c.y-bh*0.12, bw, Math.max(1,bh*0.24));
  if (bh > 16) {
    X.textBaseline = 'middle';
    text('停', c.x, c.y-bh*0.28, `bold ${Math.floor(bh*0.34)}px ${JP}`, '#fff', 'center');
    X.textBaseline = 'alphabetic';
  }
}

function drawPlatform(st, zStop) {
  // Platforms sit beside the track, so like passing trains they stay in view
  // well inside CAM.NEAR — clip at the camera plane or our (left-hand) deck
  // vanishes from the window edge while running alongside it.
  const z1 = Math.max(1.2, zStop - PLAT_LEN), z2 = zStop + 26;
  if (z2 <= 1.5) return;
  const segs = 12, ROOF = 4.55;
  for (let side=-1; side<=1; side+=2) {
    // 相対式ホーム: our platform on the left (we keep left); the right platform
    // sits BEYOND the opposite running track so neither deck covers a track.
    const ours = side < 0;
    const off  = ours ? 0 : OPP_X;
    const e    = side*(PLAT_EDGE + off);
    const back = side*(9.6 + off);
    const inner= side*(2.1 + off);
    const colX = side*(7.4 + off);
    const gate = e + side*0.25;              // platform-door line, just in from the edge
    // each bay becomes one depth-sorted chunk so passing trains interleave correctly.
    // Everything discrete (columns, gate posts, furniture, people) is placed on a
    // STATION-relative grid (g = metres from the stop point), so it is fixed to the
    // platform and recedes as the train advances — never anchored to the train.
    for (let i=segs-1;i>=0;i--) {
      const a = z1 + (z2-z1)*i/segs, b = z1 + (z2-z1)*(i+1)/segs, zm = (a+b)/2;
      const g0 = a - zStop, g1 = b - zStop;
      DL.push({z: b, pr: 0, lamp: 1, f: () => {
        wall(back, PLAT_H, 3.4, a, b, haze(zm, 74, 76, 80));                   // back wall, in shade
        // platform face: an overhanging lip over the 待避空間 refuge recess
        wall(e+side*0.6, 0, PLAT_H-0.22, a, b, haze(zm, 36, 36, 38));          // recess back, in shadow
        slab(e, e+side*0.6, 0.02, a, b, haze(zm, 54, 52, 50));                 // recess floor
        for (let g = Math.ceil(g0/5)*5; g < g1; g += 5) {                      // support piers
          const zg = zStop + g;
          wall(e, 0, PLAT_H-0.22, zg-0.2, zg+0.2, haze(zg, 98, 96, 92));
          if (zg-0.2 > CAM.NEAR) face(e, e+side*0.6, 0, PLAT_H-0.22, zg-0.2, haze(zg, 80, 78, 75));
        }
        wall(e, PLAT_H-0.22, PLAT_H, a, b, haze(zm, 118,116,110));             // edge lip
        slab(e, back, PLAT_H, a, b, haze(zm, 150,149,143));                    // deck, under the canopy
        if (ours && SUN.x < 0) {                                               // canopy shade falls across our track
          const xs = Math.min(2.2, inner - ROOF*SUN.x/SUN.y);
          if (xs > e) shadow(e, xs, 0.035, a, b, 0.26);
        }
        slab(e+side*0.30, e+side*1.00, PLAT_H+0.015, a, b,                     // tactile strip
             haze(zm, 232,190,38));
        for (let g = Math.ceil(g0/12)*12; g < g1; g += 12)                     // canopy columns
          wall(colX, PLAT_H, ROOF, zStop+g-0.14, zStop+g+0.14, haze(zStop+g, 92, 94, 96));
        slab(inner, back, ROOF, a, b, haze(zm, 48, 52, 57));                   // underside, in shade
        slab(inner+side*1.0, inner+side*1.7, ROOF-0.04, a, b,                  // fluorescent strip
             haze(zm, 234, 230, 205));
        wall(inner, ROOF, ROOF+0.28, a, b, haze(zm, 158,162,166));             // fascia
        // back-wall furniture: vending machines, benches, lit ad panels
        for (let g = Math.ceil(g0/13)*13; g < g1; g += 13) {
          const zg = zStop + g, r = hash(st.id*7919 + g*13 + (side>0?0:1));
          if (r < 0.32) {                                                      // vending machine
            const vc = r < 0.11 ? [206,44,40] : r < 0.21 ? [232,234,236] : [52,120,196];
            const vx = back - side*0.7, near = zg-0.45;
            wall(vx, PLAT_H, PLAT_H+1.83, near, zg+0.45, haze(zg, vc[0], vc[1], vc[2]));
            if (near > CAM.NEAR) face(vx, back, PLAT_H, PLAT_H+1.83, near, haze(zg, vc[0]*0.7, vc[1]*0.7, vc[2]*0.7));
            wall(vx, PLAT_H+1.02, PLAT_H+1.68, zg-0.38, zg+0.38, haze(zg, 236, 238, 230));  // product window
            if (zg < 70) for (let row=0; row<3; row++) for (let k=0; k<5; k++) {
              const pc = [[200,40,40],[240,200,60],[40,90,170],[230,230,230],[60,150,80]][(hash(zg*31+row*5+k)*5)|0];
              const y0 = PLAT_H+1.10+row*0.2, zk = zg-0.34+k*0.14;
              wall(vx, y0, y0+0.12, zk, zk+0.09, haze(zg, pc[0], pc[1], pc[2]));
            }
            wall(vx, PLAT_H+0.38, PLAT_H+0.9, zg-0.38, zg+0.1, haze(zg, 40, 44, 50));        // buttons / coin panel
            wall(vx, PLAT_H+0.08, PLAT_H+0.26, zg-0.3, zg+0.3, haze(zg, 24, 24, 26));        // take-out slot
          } else if (r < 0.58) {                                               // bench, three seats
            const bx = back - side*0.95;
            for (const lz of [-1.1, 1.1]) wall(bx + side*0.2, PLAT_H, PLAT_H+0.42, zg+lz-0.05, zg+lz+0.05, haze(zg, 60, 62, 66));
            slab(bx, bx + side*0.45, PLAT_H+0.42, zg-1.3, zg+1.3, haze(zg, 66, 110, 160));
            wall(bx, PLAT_H+0.34, PLAT_H+0.44, zg-1.3, zg+1.3, haze(zg, 44, 80, 122));       // seat front edge
            wall(bx + side*0.45, PLAT_H+0.42, PLAT_H+0.86, zg-1.3, zg+1.3, haze(zg, 58, 100, 148));
          } else if (r < 0.82) {                                               // back-lit ad panel
            const ax = back - side*0.1, ac = [[64,124,190],[214,90,60],[60,150,110],[230,190,60]][(r*40|0)%4];
            wall(ax, PLAT_H+1.05, PLAT_H+2.55, zg-1.45, zg+1.45, haze(zg, 70, 72, 76));      // frame
            wall(ax - side*0.02, PLAT_H+1.12, PLAT_H+2.48, zg-1.38, zg+1.38, haze(zg, 244, 244, 236));
            wall(ax - side*0.03, PLAT_H+1.6, PLAT_H+2.4, zg-1.3, zg+0.2, haze(zg, ac[0], ac[1], ac[2]));
            wall(ax - side*0.03, PLAT_H+1.25, PLAT_H+1.45, zg-1.3, zg+0.8, haze(zg, 60, 60, 66));
          }
        }
        // hanging 駅名標 (JR East style) and a 発車標 near the stairs
        for (let g = Math.ceil((g0+15)/55)*55-15; g < g1; g += 55) drawNameBoard(st, side, inner, ROOF, zStop+g);
        for (const g of [-60, -158]) if (g >= g0 && g < g1) drawDepartureBoard(st, side, inner, ROOF, zStop+g);
        // 乗車位置 queue lines painted on the deck, and passengers lined up behind each door
        const lf = lit(side>0 ? 'l' : 'r');
        const open = ours && S.phase==='stopped' && Math.abs(zStop) < 12;
        const ppl = [];
        for (const d of DOOR_G) {
          if (d < g0-1 || d >= g1) continue;
          const zd = zStop + d;
          if (zd < 60) for (const q of [-0.95, 0, 0.95])
            slab(gate+side*0.25, gate+side*2.2, PLAT_H+0.012, zd+q-0.04, zd+q+0.04, haze(zd, 90, 160, 96));
          const n = (hash(st.id*7907 + d*13 + (side>0?0:3))*5)|0;
          for (let k=0; k<n; k++) for (const lane of [-0.48, 0.48]) {
            const r = hash(st.id*104729 + d*31 + k*7 + (lane>0?1:0));
            if (k >= n-1 && r < 0.5) continue;
            ppl.push([gate + side*(open ? 0.3 + k*0.6 : 0.7 + k*0.62), zd + lane + (r-0.5)*0.2, 1.55 + r*0.25, r]);
          }
        }
        // a few people walking further back
        for (let g = Math.ceil(g0/9)*9; g < g1; g += 9) {
          const r = hash(st.id*15485863 + g*17 + (side>0?0:5));
          if (r >= 0.6) ppl.push([e + side*(3.6 + r*3.2), zStop + g + r*4, 1.55 + r*0.22, r]);
        }
        // far to near, with the stop marker slotted in at its depth
        if (ours && zStop >= a && zStop < b && zStop > CAM.NEAR) ppl.push([0, zStop, 0, -1]);
        ppl.sort((p, q) => q[1] - p[1]);
        for (const p of ppl) p[3] < 0 ? drawStopMarker(zStop) : drawPerson(p[0], p[1], p[2], p[3]);
        // ホームドア: solid 戸袋 cabinets between door openings, leaves slide into them
        const gt = gate + side*0.28;
        for (let i=GATE_CABS.length-1; i>=0; i--) {
          const c0 = Math.max(GATE_CABS[i][0], g0), c1 = Math.min(GATE_CABS[i][1], g1);
          if (c0 >= c1) continue;
          const za = zStop+c0, zb = zStop+c1, zc = (za+zb)/2;
          slab(gate, gt, PLAT_H+GATE_H, za, zb, haze(zc, 196*lf, 200*lf, 202*lf));
          wall(gate, PLAT_H, PLAT_H+GATE_H, za, zb, haze(zc, 214*lf, 218*lf, 220*lf));
          wall(gate-side*0.005, PLAT_H+1.02, PLAT_H+1.1, za, zb, haze(zc, 128, 184, 56));   // ウグイス band
          wall(gate-side*0.005, PLAT_H, PLAT_H+0.1, za, zb, haze(zc, 120, 124, 128));      // kick plate
          if (c0 === GATE_CABS[i][0] && za > CAM.NEAR)
            face(gate, gt, PLAT_H, PLAT_H+GATE_H, za, haze(za, 176, 180, 184));
        }
        if (!open) for (const d of DOOR_G) {                                   // closed door leaves
          if (d-GATE_OPEN >= g1 || d+GATE_OPEN <= g0) continue;
          const zl = zStop + Math.max(d-GATE_OPEN, g0), zr = zStop + Math.min(d+GATE_OPEN, g1);
          wall(gate+side*0.12, PLAT_H+0.04, PLAT_H+GATE_H-0.08, zl, zr, haze(zl, 200*lf, 206*lf, 210*lf));
          X.globalAlpha = 0.5;
          wall(gate+side*0.11, PLAT_H+0.62, PLAT_H+1.08, zl+0.15, zr-0.15, haze(zl, 120, 140, 156)); // window
          X.globalAlpha = 1;
          if (zStop+d > CAM.NEAR) wall(gate+side*0.11, PLAT_H+0.04, PLAT_H+GATE_H-0.08, zStop+d-0.02, zStop+d+0.02, haze(zl, 90, 96, 100));
        }
      }});
    }
    // stairwell house mid-platform — the way down into the station
    const sw1 = zStop - 96, sw2 = zStop - 76;
    if (sw2 > z1 && sw1 < z2) DL.push({z: sw2, pr: 0, lamp: 1, f: () => {
      const sx = e + side*2.4, zs = Math.max(z1, sw1);
      wall(sx, PLAT_H, ROOF+0.55, zs, sw2, haze((zs+sw2)/2, 128, 132, 138));
      slab(sx, back, ROOF+0.55, zs, sw2, haze((zs+sw2)/2, 96, 100, 106));
      if (sw1 > z1) face(sx, back, PLAT_H, ROOF+0.55, sw1, haze(sw1, 140, 144, 150));
    }});
    // the canopy has to end somewhere — cap the near edge
    if (z1 > CAM.NEAR + 0.5) DL.push({z: z1, pr: 0, lamp: 1, f: () => {
      face(inner, back, ROOF, ROOF+0.28, z1, haze(z1, 168,172,176));
      face(e, back, 0, PLAT_H, z1, haze(z1, 100, 99, 96));
    }});
  }
}

function drawStations() {
  const lp = loopPos(S.train.position);
  const list = [];
  for (const st of STATIONS) {
    let z = st.pos - lp;
    if (z >  TOTAL_LOOP/2) z -= TOTAL_LOOP;
    if (z < -TOTAL_LOOP/2) z += TOTAL_LOOP;
    if (z > -300 && z < 640) list.push({st:st, z:z});
  }
  list.sort((a,b) => b.z - a.z);
  for (const it of list) drawPlatform(it.st, it.z);
}

// ============================================================
// HEADLIGHT & RAIN — drawn over the finished forward view
// ============================================================
function drawHeadlight() {
  if (ENV.time === 'day' && !ENV.rain) return;
  const a = ENV.night ? 0.42 : ENV.time === 'eve' ? 0.1 : 0.06;
  X.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 8; i++) {
    const z1 = ZSEG[i], z2 = ZSEG[i+1], k = a*Math.pow(1 - z1/ZSEG[8], 1.5);
    slab(-1.7, 1.7, -0.26, z1, z2, `rgba(255,236,200,${k.toFixed(3)})`);
  }
  X.globalCompositeOperation = 'source-over';
}
// Falling rain as world particles: they stream toward the cab as it moves.
function drawRain() {
  if (!ENV.rain) return;
  const t = performance.now()/1000, p = S.train.position, v = S.train.speed/3.6;
  X.strokeStyle = 'rgba(196,206,218,0.30)'; X.lineWidth = 1;
  X.beginPath();
  for (let i = 0, n = LOWQ ? 120 : 280; i < n; i++) {
    const x = (hash(i*5+1) - 0.5)*26;
    const z = 3 + ((hash(i*5+2)*70 - p) % 70 + 70) % 70;
    const y = ((hash(i*5+3)*11 - t*9) % 11 + 11) % 11 - 0.5;
    const a = CAM.project(x, y, z), b = CAM.project(x, y + 0.5, z + 0.05 + Math.min(3, v*0.05));
    X.moveTo(a.x, a.y); X.lineTo(b.x, b.y);
  }
  X.stroke();
}

// ============================================================
// CAB SHELL — pillars, roof, window frame, glass
// ============================================================
const WIPE_PARK = -Math.PI*0.965, WIPE_TOP = -Math.PI*0.42, WIPE_T = 1.5;
const WIPER = {
  a: WIPE_PARK, prev: WIPE_PARK, t: 0,
  update(dt) {
    this.prev = this.a;
    if (ENV.rain || this.t > 0) {                     // finish the stroke after the rain stops
      this.t += dt;
      this.t = !ENV.rain && this.t >= WIPE_T ? 0 : this.t % WIPE_T;
    }
    this.a = WIPE_PARK + (WIPE_TOP - WIPE_PARK)*(0.5 - 0.5*Math.cos(2*Math.PI*this.t/WIPE_T));
  },
};
// raindrops on the glass: each reappears a while after the blade last wiped it
const DROPS = Array.from({length: 220}, (_, i) => ({
  u: hash(i*13+1), v: Math.pow(hash(i*13+2), 0.8), r: 0.7 + hash(i*13+3)*1.8, d: hash(i*13+4)*1.6, t: -99,
}));

function drawCabShell() {
  const wx = LAY.winX, wy = LAY.winY, ww = LAY.winW, wh = LAY.winH, wb = LAY.winB;
  // wiper geometry: pivot just below the glass, blade parked along the bottom edge
  const pvx = wx+ww*0.36, pvy = wb+wh*0.035, arm = ww*0.30;
  X.save();
  X.beginPath(); X.rect(wx, wy, ww, wh); X.clip();
  // glass tint
  const gl = X.createLinearGradient(0, wy, 0, wb);
  gl.addColorStop(0,'rgba(150,180,205,0.14)'); gl.addColorStop(0.35,'rgba(150,180,205,0.02)');
  gl.addColorStop(1,'rgba(120,140,160,0.06)');
  X.fillStyle = gl; X.fillRect(wx, wy, ww, wh);
  // road grime everywhere except the arc the wiper sweeps clean
  X.beginPath(); X.rect(wx, wy, ww, wh);
  X.moveTo(pvx, pvy); X.arc(pvx, pvy, arm*1.04, -Math.PI*0.97, -Math.PI*0.42);
  X.lineTo(pvx, pvy);
  if (!LOWQ) X.filter = `blur(${Math.max(2, H*0.008)}px)`;                         // the swept edge is soft
  X.fillStyle = 'rgba(120,110,92,0.05)'; X.fill('evenodd');
  X.filter = 'none';
  const dg = X.createLinearGradient(0, wb-wh*0.22, 0, wb);                 // spray film low on the glass
  dg.addColorStop(0,'rgba(110,100,84,0)'); dg.addColorStop(1,'rgba(110,100,84,0.10)');
  X.fillStyle = dg; X.fillRect(wx, wb-wh*0.22, ww, wh*0.22);
  // dust specks and dried drops, fixed to the glass
  for (let i=0; i<160; i++) {
    const sx = wx + hash(i*3+1)*ww, sy = wy + Math.pow(hash(i*3+2), 0.6)*wh;
    const dx = sx-pvx, dy = sy-pvy, swept = dx*dx+dy*dy < arm*arm*1.08 && Math.atan2(dy, dx) < -Math.PI*0.42;
    if (swept && hash(i*7) < 0.8) continue;
    X.fillStyle = `rgba(${hash(i)<0.5 ? '235,230,215' : '70,62,52'},${0.10+hash(i*5)*0.14})`;
    X.beginPath(); X.arc(sx, sy, 0.5 + hash(i*3+3)*H*0.0022, 0, Math.PI*2); X.fill();
  }
  // raindrops
  if (ENV.rain || WIPER.t > 0) {
    const now = performance.now()/1000, lo = Math.min(WIPER.prev, WIPER.a), hi = Math.max(WIPER.prev, WIPER.a);
    for (const d of DROPS) {
      const sx = wx + d.u*ww, sy = wy + d.v*wh, ang = Math.atan2(sy-pvy, sx-pvx);
      if (Math.hypot(sx-pvx, sy-pvy) < arm*1.04 && ang >= lo-0.02 && ang <= hi+0.02) d.t = now;
      const al = ENV.rain ? Math.max(0, Math.min(1, (now - d.t - d.d)/1.2)) : 0;
      if (al <= 0) continue;
      const r = d.r*H/900*1.6;
      X.fillStyle = `rgba(210,220,230,${0.16*al})`;
      X.beginPath(); X.arc(sx, sy, r, 0, Math.PI*2); X.fill();
      X.fillStyle = `rgba(0,0,0,${0.22*al})`;
      X.beginPath(); X.arc(sx, sy + r*0.25, r*0.8, 0, Math.PI); X.fill();
      X.fillStyle = `rgba(255,255,255,${0.45*al})`;
      X.fillRect(sx - r*0.4, sy - r*0.45, Math.max(1, r*0.35), Math.max(1, r*0.35));
    }
  }
  // the desk reflected in the raked glass: TIMS glow and the speedometer bezel
  X.globalCompositeOperation = 'lighter';
  const rk = ENV.night ? 3 : ENV.time === 'eve' || ENV.wx !== 'clear' ? 1.6 : 1;   // stronger when it's dark out
  if (!LOWQ) X.filter = `blur(${Math.max(3, H*0.012)}px)`;
  const rf = (yc) => wb - (yc - wb)*0.45;                                 // mirror, foreshortened
  X.fillStyle = `rgba(40,80,130,${0.06*rk})`;
  X.fillRect(W*0.60, rf(LAY.conY+LAY.conH*0.94), W*0.375, (LAY.conH*0.85)*0.45);
  X.fillStyle = `rgba(120,130,140,${0.035*rk})`;
  X.beginPath(); X.ellipse(W*0.325, rf(LAY.conY+LAY.conH*0.5), W*0.075, LAY.conH*0.2, 0, 0, Math.PI*2); X.fill();
  X.fillStyle = 'rgba(255,255,255,0.03)';
  X.fillRect(wx, wb-wh*0.04, ww, wh*0.04);                                // desk top edge
  X.filter = 'none';
  // sky glare streak
  X.fillStyle = 'rgba(223,240,255,0.04)';
  X.beginPath();
  X.moveTo(wx+ww*0.04, wb); X.lineTo(wx+ww*0.30, wy);
  X.lineTo(wx+ww*0.40, wy); X.lineTo(wx+ww*0.14, wb);
  X.closePath(); X.fill();
  X.globalCompositeOperation = 'source-over';
  // vignette: the glass darkens toward the frame
  const vg = X.createRadialGradient(wx+ww/2, wy+wh*0.55, wh*0.45, wx+ww/2, wy+wh*0.55, ww*0.62);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.30)');
  X.fillStyle = vg; X.fillRect(wx, wy, ww, wh);
  // roller blinds (遮陽簾): smoked film, left one pulled part-way down
  const bl = wy + wh*0.16;
  X.fillStyle = 'rgba(28,32,26,0.62)'; X.fillRect(wx, wy, ww*0.52, bl-wy);
  X.fillStyle = '#2a2e32'; X.fillRect(wx, bl-H*0.006, ww*0.52, H*0.006);  // bottom bar
  X.fillStyle = '#3c4247'; X.fillRect(wx+ww*0.25, bl, ww*0.02, H*0.012);  // pull tab
  X.fillStyle = '#16191c'; X.fillRect(wx, wy, ww, wh*0.03);               // roller housing
  X.fillStyle = 'rgba(28,32,26,0.62)'; X.fillRect(wx+ww*0.52, wy, ww*0.48, wh*0.045);
  // wiper: arm from the pivot, blade with spine and yokes, slightly out of focus
  const ang = WIPER.a, tx = pvx + Math.cos(ang)*arm, ty = pvy + Math.sin(ang)*arm;
  if (!LOWQ) X.filter = `blur(${Math.max(0.5, H*0.0012)}px)`;
  X.lineCap = 'round';
  X.strokeStyle = '#121416'; X.lineWidth = H*0.009;
  X.beginPath(); X.moveTo(pvx, pvy); X.lineTo(pvx + (tx-pvx)*0.55, pvy + (ty-pvy)*0.55 - H*0.004); X.stroke();
  X.strokeStyle = '#202326'; X.lineWidth = H*0.011;                       // blade spine
  X.beginPath(); X.moveTo(pvx-(tx-pvx)*0.02, pvy-H*0.004); X.lineTo(tx, ty - H*0.006); X.stroke();
  X.strokeStyle = 'rgba(255,255,255,0.14)'; X.lineWidth = H*0.002;        // light catching its top
  X.beginPath(); X.moveTo(pvx-(tx-pvx)*0.02, pvy-H*0.009); X.lineTo(tx, ty - H*0.011); X.stroke();
  X.strokeStyle = '#08090a'; X.lineWidth = H*0.003;                        // rubber
  X.beginPath(); X.moveTo(pvx, pvy+H*0.002); X.lineTo(tx, ty); X.stroke();
  X.fillStyle = '#1c1f22';
  for (const t of [0.15, 0.38, 0.62, 0.85]) {                              // yokes
    const yx = pvx + (tx-pvx)*t, yy = pvy + (ty-pvy)*t;
    X.fillRect(yx - H*0.006, yy - H*0.009, H*0.012, H*0.006);
  }
  X.lineCap = 'butt'; X.filter = 'none';
  X.restore();

  // ceiling: panels, speaker grille, dome light
  const roof = X.createLinearGradient(0, 0, 0, wy);
  roof.addColorStop(0,'#3a3f45'); roof.addColorStop(0.6,'#22262a'); roof.addColorStop(1,'#0e1012');
  X.fillStyle = roof; X.fillRect(0, 0, W, wy);
  X.fillStyle = 'rgba(0,0,0,0.35)';
  for (const f of [0.22, 0.5, 0.78]) X.fillRect(W*f, 0, Math.max(1, W*0.0012), wy*0.8);
  X.fillStyle = '#16191c'; rrect(W*0.62, wy*0.18, W*0.07, wy*0.36, wy*0.08); X.fill();
  X.fillStyle = '#2c3136';
  for (let i=0; i<12; i++) X.fillRect(W*0.625 + i*W*0.0052, wy*0.25, Math.max(1, W*0.0015), wy*0.22);
  X.fillStyle = '#c9cdc4'; rrect(W*0.36, wy*0.12, W*0.06, wy*0.22, wy*0.1); X.fill();
  X.fillStyle = 'rgba(255,255,255,0.35)'; X.fillRect(W*0.365, wy*0.15, W*0.05, wy*0.06);

  // left pillar, with a sliver of the side window beyond it
  const sw = wx*0.42;
  const sg = X.createLinearGradient(0, wy, 0, wb);
  sg.addColorStop(0,'#8fa7bd'); sg.addColorStop(0.45,'#a9b4bd'); sg.addColorStop(0.5,'#6d7468'); sg.addColorStop(1,'#4c5048');
  X.fillStyle = sg; X.fillRect(0, wy, sw, wh);
  for (let i=0; i<6; i++) {                                                // scenery streaking past
    const u = ((hash(i*11)*400 - S.train.position*1.6) % 400 + 400) % 400 / 400;
    X.fillStyle = `rgba(${hash(i)<0.5 ? '60,66,72' : '170,176,180'},0.35)`;
    X.fillRect(u*sw*3 - sw, wy + wh*(0.25 + hash(i*5)*0.3), sw*(0.3 + hash(i*7)*0.6), wh*(0.1 + hash(i*9)*0.3));
  }
  X.fillStyle = 'rgba(150,180,205,0.18)'; X.fillRect(0, wy, sw, wh);
  X.fillStyle = '#0b0c0e'; X.fillRect(sw-2, wy, 3, wh);                    // seal
  const pil = X.createLinearGradient(sw, 0, wx, 0);
  pil.addColorStop(0,'#14171a'); pil.addColorStop(0.5,'#2c3136'); pil.addColorStop(1,'#191c1f');
  X.fillStyle = pil; X.fillRect(sw+1, wy, wx-sw-1, wh);
  const pir = X.createLinearGradient(wx+ww, 0, W, 0);
  pir.addColorStop(0,'#191c1f'); pir.addColorStop(0.45,'#2c3136'); pir.addColorStop(1,'#14171a');
  X.fillStyle = pir; X.fillRect(wx+ww, wy, W-wx-ww, wh);

  // rubber seal + metal frame
  X.strokeStyle = '#0b0c0e'; X.lineWidth = Math.max(6, W*0.006);
  X.strokeRect(wx-X.lineWidth/2, wy-X.lineWidth/2, ww+X.lineWidth, wh+X.lineWidth);
  X.strokeStyle = '#565c62'; X.lineWidth = 2;
  X.strokeRect(wx-1, wy-1, ww+2, wh+2);
  X.strokeStyle = 'rgba(255,255,255,0.10)'; X.lineWidth = 1;
  X.strokeRect(wx+2, wy+2, ww-4, wh-4);

  // grab handle on the left pillar
  const gx = (sw+wx)/2, g1 = wy+wh*0.24, g2 = wy+wh*0.60;
  X.strokeStyle = '#2a2f34'; X.lineWidth = Math.max(6, W*0.0065);
  X.beginPath(); X.moveTo(gx, g1); X.lineTo(gx, g2); X.stroke();
  X.strokeStyle = '#79828a'; X.lineWidth = Math.max(3, W*0.0035);
  X.beginPath(); X.moveTo(gx, g1); X.lineTo(gx, g2); X.stroke();
  X.fillStyle = '#3d4348';
  for (const gy of [g1, g2]) { X.beginPath(); X.arc(gx, gy, Math.max(3, W*0.0042), 0, Math.PI*2); X.fill(); }

  // right pillar: 列車無線 unit and the 行路表 holder
  const rx = wx+ww+(W-wx-ww)*0.14, rw = (W-wx-ww)*0.72;
  X.fillStyle = '#1b1e21'; rrect(rx, wy+wh*0.08, rw, wh*0.3, 4); X.fill();
  X.strokeStyle = '#3a4046'; X.lineWidth = 1; rrect(rx, wy+wh*0.08, rw, wh*0.3, 4); X.stroke();
  X.fillStyle = '#0e1a10'; X.fillRect(rx+rw*0.12, wy+wh*0.11, rw*0.76, wh*0.05);   // LCD
  X.textBaseline = 'middle';
  text('CH 2', rx+rw*0.5, wy+wh*0.135, `${Math.max(7, Math.floor(rw*0.16))}px monospace`, '#7fe08a', 'center');
  X.textBaseline = 'alphabetic';
  X.fillStyle = '#3a4046';
  for (let i=0; i<6; i++) X.fillRect(rx+rw*(0.14+(i%3)*0.26), wy+wh*(0.19+Math.floor(i/3)*0.045), rw*0.2, wh*0.03);
  X.fillStyle = '#0f1113'; rrect(rx+rw*0.2, wy+wh*0.29, rw*0.6, wh*0.07, 3); X.fill();    // handset
  X.strokeStyle = '#0f1113'; X.lineWidth = 2;                              // curly cord
  X.beginPath();
  for (let i=0; i<=14; i++) X.lineTo(rx+rw*0.5 + Math.sin(i*1.9)*rw*0.08, wy+wh*(0.36+i*0.012));
  X.stroke();
  const ky = wy+wh*0.6;                                                    // 行路表 clipboard
  X.fillStyle = '#4a3a2a'; X.fillRect(rx, ky, rw, wh*0.34);
  X.fillStyle = '#e4e2d8'; X.fillRect(rx+rw*0.08, ky+wh*0.03, rw*0.84, wh*0.29);
  X.fillStyle = '#9aa0a4'; X.fillRect(rx+rw*0.3, ky-wh*0.01, rw*0.4, wh*0.035);
  X.fillStyle = 'rgba(40,44,50,0.55)';
  for (let i=0; i<10; i++) X.fillRect(rx+rw*0.14, ky+wh*(0.06+i*0.024), rw*(0.3+hash(i*13)*0.4), Math.max(1, wh*0.006));
}

// ============================================================
// CONSOLE — the driver's desk everything sits on
// ============================================================
function drawConsole() {
  const y0 = LAY.conY, h = LAY.conH;
  const g = X.createLinearGradient(0, y0, 0, y0+h);
  g.addColorStop(0,'#6a7178'); g.addColorStop(0.035,'#454b51');
  g.addColorStop(0.18,'#2e3338'); g.addColorStop(1,'#131518');
  X.fillStyle = g; X.fillRect(0, y0, W, h);
  // desk lip
  X.fillStyle = '#7d858c'; X.fillRect(0, y0, W, Math.max(2, H*0.003));
  X.fillStyle = '#1b1e21'; X.fillRect(0, y0+Math.max(2,H*0.003), W, Math.max(1, H*0.0015));
  // panel seams
  X.strokeStyle = 'rgba(255,255,255,0.045)'; X.lineWidth = 1;
  for (const fx of [0.235, 0.585]) {
    X.beginPath(); X.moveTo(W*fx, y0+h*0.06); X.lineTo(W*fx, y0+h*0.94); X.stroke();
  }
  // hint bar
  X.fillStyle = '#0a0b0c'; X.fillRect(0, LAY.hintY, W, H-LAY.hintY);
  X.fillStyle = '#23262a'; X.fillRect(0, LAY.hintY, W, 1);
}

// ============================================================
// MASTER CONTROLLER — 主幹制御器
// E235 left-hand one-handle controller, seen from the driver's seat: a T-grip
// on a shaft that rides in a slot across the controller box. The box top is
// drawn in perspective (far end narrower), so forward = up = brake side.
// ============================================================
const NOTCHES = ['EB','B8','B7','B6','B5','B4','B3','B2','B1','N','P1','P2','P3','P4','P5'];

// Where the controller box, its notch scale and the grip are — shared by the
// renderer and the touch input that drags the handle.
function ctrlGeom() {
  const x0 = W*0.028, x1 = W*0.208, cx = (x0+x1)/2, bw = x1-x0;
  const py = LAY.conY + LAY.conH*0.09, ph = LAY.conH*0.85, by = py + ph*0.94;
  const yTop = py + ph*0.20, yBot = py + ph*0.88, stepY = (yBot-yTop)/(NOTCHES.length-1);
  const idx = S.train.emergency ? 0 : 9 + S.train.lever, hy = yTop + idx*stepY;
  const persp = y => 0.78 + 0.22*(y-py)/(by-py);   // far end of the box is smaller
  const L = ph*0.13*persp(hy);                       // shaft length: the grip sits ahead of the slot
  return {x0, x1, cx, bw, py, ph, by, yTop, yBot, stepY, idx, hy, gy: hy - L, L, persp};
}
function drawMasterController() {
  const {x0, x1, cx, bw, py, ph, by, yTop, yBot, stepY, idx, persp} = ctrlGeom();
  // controller box: a trapezoid top face plus a front lip
  const tw = bw*0.70;
  X.beginPath();
  X.moveTo(cx-tw/2, py); X.lineTo(cx+tw/2, py); X.lineTo(x1, by); X.lineTo(x0, by); X.closePath();
  const bg = X.createLinearGradient(0, py, 0, by);
  bg.addColorStop(0,'#2a2e33'); bg.addColorStop(1,'#1b1e22');
  X.fillStyle = bg; X.fill();
  X.strokeStyle = '#4a5157'; X.lineWidth = 1.2; X.stroke();
  X.fillStyle = '#101214'; X.fillRect(x0, by, bw, ph*0.05);

  const fs = Math.max(8, Math.min(W*0.0078, H*0.0145));

  // notch readout window, upper left of the box (the handle can hide the scale)
  const nTxt = S.train.emergency ? 'EB' : NOTCHES[idx];
  const rx = cx - tw/2 + fs*0.6, ry = py + fs*0.5;
  X.fillStyle = '#05090a'; rrect(rx, ry, fs*3.2, fs*1.6, 2); X.fill();
  X.strokeStyle = '#3a4046'; X.lineWidth = 1; rrect(rx, ry, fs*3.2, fs*1.6, 2); X.stroke();
  X.textBaseline = 'middle';
  text(nTxt, rx+fs*1.6, ry+fs*0.82, `${Math.floor(fs*1.1)}px monospace`,
       idx===0 ? '#ff5a4a' : idx<9 ? '#ffc04a' : idx>9 ? '#8fe0ff' : '#d8dde2', 'center');

  // slot
  X.fillStyle = '#060707';
  X.beginPath();
  X.moveTo(cx-bw*0.022*persp(yTop), yTop-stepY*0.6); X.lineTo(cx+bw*0.022*persp(yTop), yTop-stepY*0.6);
  X.lineTo(cx+bw*0.026, yBot+stepY*0.6);             X.lineTo(cx-bw*0.026, yBot+stepY*0.6);
  X.closePath(); X.fill();

  // engraved scale beside the slot, with zone bars (EB red, brake amber, power blue)
  for (let i=0;i<NOTCHES.length;i++) {
    const y = yTop + i*stepY, k = persp(y);
    const zc = i===0 ? '#c8372c' : i<9 ? '#b5822a' : i>9 ? '#3d86b8' : '#9aa3ab';
    X.fillStyle = zc; X.fillRect(cx + bw*0.06*k, y - stepY*0.42, Math.max(2, bw*0.012*k), stepY*0.84);
    X.fillStyle = '#8c949b'; X.fillRect(cx + bw*0.035*k, y-0.5, bw*0.02*k, 1);
    if (stepY >= fs*0.95 || [0, 5, 9, 14].includes(i))   // cramped scale: label the key notches only
      text(NOTCHES[i], cx + bw*0.09*k, y, `${Math.floor(fs*1.1*k)}px monospace`, '#c9ced3', 'start');
  }

  // handle: rubber boot in the slot, shaft, then the T-grip ahead of it
  const hy = yTop + idx*stepY, k = persp(hy), L = ph*0.13*k;
  X.beginPath(); X.ellipse(cx, hy, bw*0.05*k, stepY*0.55, 0, 0, Math.PI*2);
  X.fillStyle = '#0d0e10'; X.fill();
  X.globalAlpha = 0.35;                               // the grip's shadow on the box
  X.beginPath(); X.ellipse(cx+bw*0.03, hy-L*0.35, bw*0.17*k, stepY*0.7, 0, 0, Math.PI*2);
  X.fillStyle = '#000'; X.fill(); X.globalAlpha = 1;
  const sg = X.createLinearGradient(cx-bw*0.02, 0, cx+bw*0.02, 0);
  sg.addColorStop(0,'#4d545a'); sg.addColorStop(0.45,'#b9c0c6'); sg.addColorStop(1,'#3a4046');
  X.fillStyle = sg; X.fillRect(cx-bw*0.016*k, hy-L, bw*0.032*k, L);
  const gw = bw*0.40*k, gh = Math.max(8, ph*0.075*k), gy = hy - L;
  const gg = X.createLinearGradient(0, gy-gh/2, 0, gy+gh/2);
  gg.addColorStop(0,'#5a6066'); gg.addColorStop(0.3,'#2a2e33'); gg.addColorStop(1,'#0c0d0f');
  X.fillStyle = gg; rrect(cx-gw/2, gy-gh/2, gw, gh, gh/2); X.fill();
  X.strokeStyle = 'rgba(255,255,255,0.12)'; X.lineWidth = 1;
  X.beginPath(); X.moveTo(cx-gw/2+gh*0.4, gy-gh*0.28); X.lineTo(cx+gw/2-gh*0.4, gy-gh*0.28); X.stroke();
  X.textBaseline = 'alphabetic';
}

// ============================================================
// SPEEDOMETER — D-ATC 速度計. The permitted speed is a lit marker on the
// LED ring outside the scale; an approaching lower limit lights a second,
// blinking 予告 marker. No colour bands — the driver reads the marker.
// ============================================================
function drawSpeedometer() {
  const cx = W*0.325, cy = LAY.conY + LAY.conH*0.50;
  const r = Math.min(W*0.068, LAY.conH*0.42);
  const speed = S.train.speed, limit = getSpeedLimit(S.train.position);
  const nl = getNextCurveLimit(S.train.position);
  const A0 = Math.PI*0.75, A1 = Math.PI*2.25, MAXV = 120;
  const ang = v => A0 + (Math.min(v,MAXV)/MAXV)*(A1-A0);

  // bezel and face
  const bz = X.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
  bz.addColorStop(0,'#767d84'); bz.addColorStop(0.5,'#2b3036'); bz.addColorStop(1,'#5b6268');
  X.beginPath(); X.arc(cx, cy, r*1.14, 0, Math.PI*2); X.fillStyle = bz; X.fill();
  X.beginPath(); X.arc(cx, cy, r*1.03, 0, Math.PI*2); X.fillStyle = '#050607'; X.fill();
  X.beginPath(); X.arc(cx, cy, r*0.90, 0, Math.PI*2);
  const fg = X.createRadialGradient(cx, cy-r*0.4, r*0.1, cx, cy, r);
  fg.addColorStop(0,'#16191c'); fg.addColorStop(1,'#08090b');
  X.fillStyle = fg; X.fill();

  // ATC LED ring — one dim lamp every 5 km/h
  const blink = Math.floor(performance.now()/450) % 2 === 0;
  const pre = nl && nl.limit < limit && nl.dist < 600 ? nl.limit : null;
  for (let v=0; v<=MAXV; v+=5) {
    const a = ang(v), on = v===limit, warn = v===pre && blink;
    X.beginPath(); X.arc(cx+Math.cos(a)*r*0.965, cy+Math.sin(a)*r*0.965, r*0.028, 0, Math.PI*2);
    X.fillStyle = on ? '#ffb02e' : warn ? '#ffe066' : '#2a2216'; X.fill();
  }
  for (const [v, col] of [[limit, '#ffb02e'], [pre, '#ffe066']]) {   // ▼ markers just inside the ring
    if (v === null || (v === pre && !blink)) continue;
    const a = ang(v), ca = Math.cos(a), sa = Math.sin(a), r0 = r*0.92, r1 = r*0.83;
    X.beginPath();
    X.moveTo(cx+ca*r1, cy+sa*r1);
    X.lineTo(cx+ca*r0 - sa*r*0.05, cy+sa*r0 + ca*r*0.05);
    X.lineTo(cx+ca*r0 + sa*r*0.05, cy+sa*r0 - ca*r*0.05);
    X.closePath(); X.fillStyle = col;
    X.shadowColor = col; X.shadowBlur = r*0.12; X.fill(); X.shadowBlur = 0;
  }

  // ticks and numerals
  for (let v=0; v<=MAXV; v+=5) {
    const a = ang(v), major = v%10===0, label = v%20===0;
    X.strokeStyle = '#d6dbe0';
    X.lineWidth = major ? 2 : 1;
    const i0 = label ? r*0.66 : major ? r*0.70 : r*0.74;
    X.beginPath();
    X.moveTo(cx+Math.cos(a)*i0, cy+Math.sin(a)*i0);
    X.lineTo(cx+Math.cos(a)*r*0.81, cy+Math.sin(a)*r*0.81);
    X.stroke();
    if (label) {
      X.textBaseline = 'middle';
      text(v, cx+Math.cos(a)*r*0.52, cy+Math.sin(a)*r*0.52,
           `${Math.floor(r*0.15)}px "Helvetica Neue",Arial,sans-serif`, '#e4e8ec', 'center');
      X.textBaseline = 'alphabetic';
    }
  }
  text('km/h', cx, cy-r*0.30, `${Math.floor(r*0.11)}px "Helvetica Neue",Arial,sans-serif`, '#7c858d', 'center');
  X.textBaseline = 'middle';
  text('ATC', cx, cy+r*0.30, `${Math.floor(r*0.10)}px monospace`, '#a8742a', 'center');
  // small LCD readout, as on the E235 meter
  X.fillStyle = '#0c1012'; rrect(cx-r*0.22, cy+r*0.40, r*0.44, r*0.19, 2); X.fill();
  text(String(Math.round(speed)).padStart(3,' '), cx, cy+r*0.50,
       `${Math.floor(r*0.15)}px monospace`, '#cfd6dc', 'center');
  X.textBaseline = 'alphabetic';

  // needle
  const a = ang(speed);
  X.strokeStyle = '#f4f6f8'; X.lineWidth = Math.max(2, r*0.028); X.lineCap = 'round';
  X.beginPath();
  X.moveTo(cx-Math.cos(a)*r*0.16, cy-Math.sin(a)*r*0.16);
  X.lineTo(cx+Math.cos(a)*r*0.80, cy+Math.sin(a)*r*0.80);
  X.stroke(); X.lineCap = 'butt';
  X.beginPath(); X.arc(cx, cy, r*0.08, 0, Math.PI*2); X.fillStyle = '#30363c'; X.fill();
  // glass glare
  X.globalAlpha = 0.07; X.beginPath();
  X.ellipse(cx-r*0.18, cy-r*0.42, r*0.62, r*0.30, -0.35, 0, Math.PI*2);
  X.fillStyle = '#fff'; X.fill(); X.globalAlpha = 1;
}

// ============================================================
// AIR GAUGES — BC / MR, scaled 0–10 (×100 kPa)
// ============================================================
function drawGauge(cx, cy, r, label, frac, col) {
  X.beginPath(); X.arc(cx, cy, r*1.16, 0, Math.PI*2); X.fillStyle = '#2b3036'; X.fill();
  X.beginPath(); X.arc(cx, cy, r, 0, Math.PI*2); X.fillStyle = '#0b0d0f'; X.fill();
  const A0 = Math.PI*0.78, A1 = Math.PI*2.22;
  X.textBaseline = 'middle';
  for (let i=0;i<=10;i++) {
    const a = A0 + (i/10)*(A1-A0);
    X.strokeStyle = '#c4cacf'; X.lineWidth = i%2===0 ? 1.4 : 0.7;
    X.beginPath();
    X.moveTo(cx+Math.cos(a)*r*(i%2 ? 0.76 : 0.70), cy+Math.sin(a)*r*(i%2 ? 0.76 : 0.70));
    X.lineTo(cx+Math.cos(a)*r*0.88, cy+Math.sin(a)*r*0.88);
    X.stroke();
    if (i%2===0 && r > 22)
      text(i, cx+Math.cos(a)*r*0.52, cy+Math.sin(a)*r*0.52, `${Math.floor(r*0.22)}px monospace`, '#aab1b7', 'center');
  }
  text(label, cx, cy+r*0.42, `${Math.floor(Math.max(7, r*0.2))}px monospace`, '#7c858d', 'center');
  const a = A0 + Math.max(0, Math.min(1, frac))*(A1-A0);
  X.strokeStyle = col; X.lineWidth = Math.max(1.5, r*0.06); X.lineCap = 'round';
  X.beginPath(); X.moveTo(cx-Math.cos(a)*r*0.15, cy-Math.sin(a)*r*0.15);
  X.lineTo(cx+Math.cos(a)*r*0.80, cy+Math.sin(a)*r*0.80); X.stroke(); X.lineCap = 'butt';
  X.beginPath(); X.arc(cx, cy, r*0.10, 0, Math.PI*2); X.fillStyle = '#4b5258'; X.fill();
  text('×100kPa', cx, cy+r*1.45, `${Math.floor(Math.max(7, r*0.24))}px monospace`, '#5f676e', 'center');
  X.textBaseline = 'alphabetic';
}

function drawGauges() {
  const cy = LAY.conY + LAY.conH*0.33;
  const r = Math.min(W*0.026, LAY.conH*0.155);
  const t = S.train;
  const bc = t.emergency ? 0.62 : t.lever < 0 ? (-t.lever/8)*0.48 : 0.0;
  drawGauge(W*0.315+W*0.135, cy, r, 'BC', bc, '#e8553f');
  drawGauge(W*0.315+W*0.215, cy, r, 'MR', 0.82 + Math.sin(S.elapsedTime*0.7)*0.02, '#eef1f3');
}

// ============================================================
// INDICATOR LAMPS — small panel lamps; label engraved on the panel below.
// Unlit lamps still show their coloured glass, dimly.
// ============================================================
function drawLamps() {
  const t = S.train;
  const limit = getSpeedLimit(S.train.position);
  const lamps = [
    ['ATC',  S.phase!=='start',      [244,240,224]],
    ['戸閉',  S.phase!=='stopped' && !(S.phase==='departing' && S.boardingTime > DEPART_T-1.2), [255,171,61]],
    ['力行',  t.lever>0 && !t.emergency, [120,224,110]],
    ['制動',  t.lever<0 && !t.emergency, [255,214,64]],
    ['過速',  t.speed > limit,        [255,72,58]],
    ['非常',  t.emergency,            [255,72,58]],
  ];
  const x0 = W*0.425, x1 = W*0.582, y0 = LAY.conY + LAY.conH*0.66;
  const n = lamps.length, cw = (x1-x0)/n, lw = cw*0.62, lh = LAY.conH*0.075;
  const fs = Math.max(7, Math.min(W*0.0072, H*0.0135));
  X.fillStyle = '#16191c'; rrect(x0-cw*0.12, y0-lh*0.7, (x1-x0)+cw*0.24, lh*2.9, 4); X.fill();
  X.strokeStyle = '#3a4046'; X.lineWidth = 1; rrect(x0-cw*0.12, y0-lh*0.7, (x1-x0)+cw*0.24, lh*2.9, 4); X.stroke();
  lamps.forEach((l, i) => {
    const x = x0 + i*cw + (cw-lw)/2, c = l[2];
    X.fillStyle = '#050607'; rrect(x-2, y0-2, lw+4, lh+4, 3); X.fill();      // bezel
    const g = X.createLinearGradient(0, y0, 0, y0+lh);
    if (l[1]) {
      g.addColorStop(0, `rgb(${Math.min(255,c[0]+40)},${Math.min(255,c[1]+40)},${Math.min(255,c[2]+40)})`);
      g.addColorStop(1, `rgb(${c[0]},${c[1]},${c[2]})`);
      X.shadowColor = `rgb(${c[0]},${c[1]},${c[2]})`; X.shadowBlur = lh*0.9;
    } else {
      g.addColorStop(0, `rgb(${c[0]*0.22|0},${c[1]*0.22|0},${c[2]*0.22|0})`);
      g.addColorStop(1, `rgb(${c[0]*0.12|0},${c[1]*0.12|0},${c[2]*0.12|0})`);
    }
    X.fillStyle = g; rrect(x, y0, lw, lh, 2); X.fill(); X.shadowBlur = 0;
    X.fillStyle = 'rgba(255,255,255,0.10)'; X.fillRect(x+2, y0+1, lw-4, lh*0.3);   // glass sheen
    X.textBaseline = 'middle';
    text(l[0], x+lw/2, y0+lh*1.75, `${Math.floor(fs)}px ${JP}`, '#c3c9ce', 'center');
    X.textBaseline = 'alphabetic';
  });
}

// ============================================================
// TIMS MONITOR — 列車情報管理装置. Dense, small type like the real screen:
// header (列番・行先・時刻), the station timetable, the next-station panel,
// the 11-car consist with door state, and a one-line message bar.
// ============================================================
function clockTime(s) {
  const t = Math.floor(ENV.start + s);   // lap departs 品川 at ENV.start
  return [Math.floor(t/3600)%24, Math.floor(t/60)%60, t%60].map(v => String(v).padStart(2,'0')).join(':');
}

// big: drawn enlarged over the windscreen (tap the TIMS to toggle). On a small
// screen the panel in the desk switches to a compact layout with larger type.
function drawTims(big) {
  const x = big ? LAY.winX + LAY.winW*0.12 : W*0.60, y = big ? LAY.winY + LAY.winH*0.06 : LAY.conY + LAY.conH*0.09;
  const w = big ? LAY.winW*0.76 : W*0.375, h = big ? LAY.winH*0.88 : LAY.conH*0.85;
  if (!big && S.phase !== 'start') hit(x, y, w, h, () => { TIMS_BIG = true; });
  X.fillStyle = '#0d0f11'; rrect(x-6, y-6, w+12, h+12, 6); X.fill();
  X.strokeStyle = '#3d434a'; X.lineWidth = 1.5; rrect(x-6, y-6, w+12, h+12, 6); X.stroke();
  X.fillStyle = '#04080c'; X.fillRect(x, y, w, h);

  const compact = !big && h < 170;
  const fs = compact ? Math.max(9, h*0.1) : Math.max(8, Math.min(w*0.0197, h*0.06));
  const F = (k, jp, b) => `${b?'bold ':''}${Math.floor(fs*k)}px ${jp ? JP : 'monospace'}`;
  // Target is always the station after the current one — stable while stopped,
  // short of the line and past it (getNextStationIndex is not,
  // since it flips the moment the stop line is crossed).
  const si = (S.currentStation+1) % STATIONS.length;
  let dist = STATIONS[si].pos - loopPos(S.train.position);
  if (dist <= 0) dist += TOTAL_LOOP;
  const over = dist > TOTAL_LOOP - 200;   // target line is just BEHIND us (overrun)
  const overBy = over ? TOTAL_LOOP - dist : 0;
  const limit = getSpeedLimit(S.train.position);
  const nl = getNextCurveLimit(S.train.position);
  const late = S.elapsedTime - stationDueTime(si);
  // phase message
  let msg = '', col = '#7ee0a8';
  switch (S.phase) {
    case 'departing':   msg = S.boardingTime > DEPART_T-1.2 ? '戸閉中' : '運行指示灯 点灯待ち'; col = '#7ee0a8'; break;
    case 'running':     msg = '走行中'; col = '#6f8ea3'; break;
    case 'approaching': msg = '▼ 減速してください'; col = '#ffd166'; break;
    case 'stopped':     msg = `停車中 — 成績を確認して 確定 (${TOUCH ? 'タップ' : 'Enter'})`; col = '#5ac8fa'; break;
  }
  if (S.phase==='approaching' && S.train.speed===0 && !over && dist > 10)
    { msg = `停止位置まで あと ${Math.round(dist)} m — 前進してください`; col = '#5ac8fa'; }
  if (nl && nl.limit < limit && nl.dist < 300 && S.train.speed > nl.limit + 2)
    { msg = `▼ この先 カーブ制限 ${nl.limit} km/h (${Math.round(nl.dist)}m)`; col = '#ffd166'; }
  if (S.train.speed > limit) { msg = '⚠ 速度超過'; col = '#ff6b5e'; }

  X.textBaseline = 'middle';
  // header
  const hh = fs*1.8;
  X.fillStyle = '#0e2a3a'; X.fillRect(x, y, w, hh);
  X.fillStyle = '#2f6f8c'; X.fillRect(x, y+hh, w, 1);
  X.fillStyle = '#9acd32'; X.fillRect(x+fs*0.5, y+hh*0.22, fs*0.35, hh*0.56);   // うぐいす色 line mark
  text(`山手線 ${ROUTE.name}`, x+fs*1.2, y+hh/2, F(0.95, true), '#e6f2fa');
  text(`列番 ${ROUTE.trainNo}`, x+w*0.42, y+hh/2, F(0.95), '#bfe3f5');
  text(clockTime(S.elapsedTime), x+w-fs*0.6, y+hh/2, F(1.0, false, true), '#e6f2fa', 'end');
  if (compact) {                       // next stop, distance and the three numbers that matter
    const by = y + hh + fs*0.3, bh = h - hh - fs*2.1, cw = w/3;
    text(STATIONS[si].name, x+fs*0.5, by+bh*0.3, F(1.35, true, true), '#ffffff');
    const dtxt = over ? `行き過ぎ ${Math.round(overBy)} m` : dist < 1000 ? Math.round(dist)+' m' : (dist/1000).toFixed(2)+' km';
    text(dtxt, x+w-fs*0.5, by+bh*0.3, F(1.25, false, true), over ? '#ff9f8a' : dist < 300 ? '#ffd166' : '#ffffff', 'end');
    [['制限', `${limit}`, S.train.speed > limit ? '#ff6b5e' : '#ffffff'],
     ['次制限', nl && nl.limit < limit ? `${nl.limit}/${Math.round(nl.dist)}m` : '---', '#ffd166'],
     ['遅れ', late > 0 ? `+${Math.round(late)}秒` : '定時', late > 15 ? '#ff9f8a' : '#7ee0a8']]
      .forEach(([k, v, c], i) => {
        text(k, x + i*cw + fs*0.5, by+bh*0.78, F(0.75, true), '#7fa4b8');
        text(v, x + (i+1)*cw - fs*0.5, by+bh*0.78, F(1.0, true, true), c, 'end');
      });
    drawTimsMessage();
    X.textBaseline = 'alphabetic';
    return;
  }

  // timetable list (left)
  const lx = x + fs*0.5, lw = w*0.50, ty = y + hh + fs*0.5;
  const rh = (h - hh - fs*2.6) / 8.6;   // rows share whatever height the screen has
  X.fillStyle = '#0b1c26'; X.fillRect(lx, ty, lw, rh);
  text('駅名', lx+fs*1.6, ty+rh/2, F(0.8, true), '#7fa4b8');
  text('着時刻', lx+lw*0.55, ty+rh/2, F(0.8, true), '#7fa4b8');
  text('制限', lx+lw-fs*0.4, ty+rh/2, F(0.8, true), '#7fa4b8', 'end');
  for (let r = 0; r < 6; r++) {
    const id = (S.currentStation + r) % STATIONS.length, ry = ty + rh*(r+1);
    const done = r === 0, cur = id === si;
    if (cur) { X.fillStyle = '#123e52'; X.fillRect(lx, ry, lw, rh); }
    X.fillStyle = '#132a36'; X.fillRect(lx, ry+rh-1, lw, 1);
    if (cur) text('▶', lx+fs*0.3, ry+rh/2, F(0.8), '#ffd166');
    const col = done ? '#4f6a78' : cur ? '#ffffff' : '#cfe3ee';
    text(STATIONS[id].name, lx+fs*1.6, ry+rh/2, F(0.95, true, cur), col);
    text(done ? '発車済' : clockTime(stationDueTime(id)), lx+lw*0.55, ry+rh/2, F(0.9, done), col);
    // tightest curve limit on the run into this station
    const prevPos = STATIONS[(id + STATIONS.length - 1) % STATIONS.length].pos;
    let lim = 90;
    for (const c of CURVES) if (c[0] >= prevPos && c[0] < (STATIONS[id].pos || TOTAL_LOOP)) lim = Math.min(lim, curveLimitOf(c[2]));
    text(done ? '' : lim, lx+lw-fs*0.4, ry+rh/2, F(0.9), lim < 90 ? '#ffd166' : col, 'end');
  }

  // next-station panel (right)
  const px = lx + lw + fs*0.6, pw = x + w - fs*0.5 - px;
  X.fillStyle = '#0b1c26'; X.fillRect(px, ty, pw, rh);
  text('次停車駅', px+fs*0.4, ty+rh/2, F(0.8, true), '#7fa4b8');
  text(`${STATIONS[si].stopTime}秒停車`, px+pw-fs*0.4, ty+rh/2, F(0.8, true), '#7fa4b8', 'end');
  text(STATIONS[si].name, px+fs*0.4, ty+rh*1.85, F(1.6, true, true), '#ffffff');
  text(STATIONS[si].nameEn, px+fs*0.4, ty+rh*2.75, F(0.75), '#7fa4b8');
  const dtxt = over ? `-${Math.round(overBy)} m`
             : dist < 1000 ? Math.round(dist)+' m' : (dist/1000).toFixed(2)+' km';
  text(over ? '行き過ぎ' : '残距離', px+pw-fs*0.4, ty+rh*1.35, F(0.75, true), over ? '#ff9f8a' : '#7fa4b8', 'end');
  text(dtxt, px+pw-fs*0.4, ty+rh*2.35, F(1.35, false, true),
       over ? '#ff9f8a' : dist < 300 ? '#ffd166' : '#ffffff', 'end');
  // small data cells
  const cells = [
    ['制限', `${limit}`, S.train.speed > limit ? '#ff6b5e' : '#ffffff'],
    ['次制限', nl && nl.limit < limit ? `${nl.limit}/${Math.round(nl.dist)}m` : '---', '#ffd166'],
    ['遅れ', late > 0 ? `+${Math.round(late)}秒` : '定時', late > 15 ? '#ff9f8a' : '#7ee0a8'],
    ['得点', `${S.totalScore}`, '#ffd166'],
  ];
  const cy0 = ty + rh*3.4, cwid = pw/2;
  cells.forEach((c, i) => {
    const cx = px + (i%2)*cwid, cyy = cy0 + Math.floor(i/2)*rh*1.75;
    X.strokeStyle = '#1d3c4c'; X.lineWidth = 1; X.strokeRect(cx+1, cyy, cwid-2, rh*1.6);
    text(c[0], cx+fs*0.4, cyy+rh*0.45, F(0.72, true), '#7fa4b8');
    text(c[1], cx+cwid-fs*0.5, cyy+rh*1.08, F(0.95, true, true), c[2], 'end');
  });

  // consist: 11 cars, 1号車 leading on the left; doors open while stopped
  const ky = ty + rh*7.55, kh = rh*0.9, kx = lx + fs*2.6, kw = (x + w - fs*0.5 - kx)/11;
  text('編成', lx, ky+kh/2, F(0.8, true), '#7fa4b8');
  const open = S.phase === 'stopped';
  for (let c = 0; c < 11; c++) {
    const cx = kx + c*kw;
    X.fillStyle = open ? '#4a3510' : '#0f2a1c';
    X.fillRect(cx+1, ky, kw-2, kh);
    X.strokeStyle = open ? '#ffab3d' : '#3fae6a'; X.lineWidth = 1; X.strokeRect(cx+1.5, ky+0.5, kw-3, kh-1);
    text(c+1, cx+kw/2, ky+kh/2, F(0.72), open ? '#ffcf8a' : '#9fe0b8', 'center');
  }

  drawTimsMessage();
  X.textBaseline = 'alphabetic';
  function drawTimsMessage() {
  const my = y + h - fs*1.7;
  X.fillStyle = '#0b1c26'; X.fillRect(x, my, w, fs*1.7);
  X.fillStyle = '#2f6f8c'; X.fillRect(x, my, w, 1);
  text(msg, x+w/2, my+fs*0.85, F(0.95, true), col, 'center');
  }
}

// ============================================================
// SECTION SUMMARY — shown on arrival; the run waits for 確定 (Enter or click)
// ============================================================
function drawStopSummary() {
  if (S.phase!=='stopped' || S.stationsVisited.length===0) return;
  const v = S.stationsVisited[S.stationsVisited.length-1];
  const N = STATIONS.length, from = STATIONS[(v.stationId + N - 1) % N].name;
  const bw = Math.min(LAY.winW*0.5, 560);
  const fs = Math.max(10, Math.min(LAY.winH*0.045, bw*0.034)), pad = fs*1.2;
  const bh = fs*21.6;   // header, four rows, totals, 確定 — sized from the text, so nothing overlaps
  const bx = LAY.winX + (LAY.winW - bw)/2, by = LAY.winY + Math.max(4, (LAY.winH - bh)/2);
  X.fillStyle = 'rgba(0,0,0,0.35)'; X.fillRect(LAY.winX, LAY.winY, LAY.winW, LAY.winH);
  X.fillStyle = 'rgba(4,10,14,0.94)'; rrect(bx, by, bw, bh, 8); X.fill();
  X.strokeStyle = '#5ac8fa'; X.lineWidth = 2; rrect(bx, by, bw, bh, 8); X.stroke();
  const F = (k, b, mono) => `${b ? 'bold ' : ''}${Math.floor(fs*k)}px ${mono ? 'monospace' : JP}`;
  X.textBaseline = 'middle';
  X.fillStyle = 'rgba(90,200,250,0.12)'; X.fillRect(bx+1, by+1, bw-2, fs*3.2);
  text(`${v.name}駅 到着`, bx+pad, by+fs*1.25, F(1.3, true), '#eaf6ff');
  text(`区間 ${from} → ${v.name}`, bx+pad, by+fs*2.45, F(0.85), '#8fb3c6');
  text('区間成績', bx+bw-pad, by+fs*1.25, F(0.85), '#8fb3c6', 'right');
  // the details behind each score
  const e = v.stopErr, ea = Math.abs(e).toFixed(1);
  const stopTxt = e < 0 ? `停止線を ${ea} m 行き過ぎ（−${OVERRUN_PENALTY}）` : Math.abs(e) < 0.3 ? '停止線ぴったり' : `停止線の ${ea} m 手前`;
  const dt = Math.round(v.segTime - v.segDue);
  const timeTxt = `区間 ${formatTime(v.segTime)} ／ 予定 ${formatTime(v.segDue)}（${dt > 0 ? `${dt}秒遅れ` : dt < 0 ? `${-dt}秒早着` : '定時'}）`;
  const rows = [
    ['停止精度', v.scores.stop, 40, stopTxt, e < 0],
    ['速度遵守', v.scores.speed, 30, v.speedV ? `制限超過 ${v.speedV} 回` : '制限超過なし', v.speedV > 0],
    ['乗り心地', v.scores.comfort, 20, v.comfortV ? `急な衝動 ${v.comfortV} 回` : '衝動なし', v.comfortV > 0],
    ['定時性',   v.scores.time, 10, timeTxt, dt > 5],
  ];
  const rh = fs*2.6;
  rows.forEach((r, i) => {
    const y = by + fs*4.4 + i*rh;
    const c = r[1] >= r[2]*0.9 ? '#7ee0a8' : r[1] >= r[2]*0.5 ? '#ffd166' : '#ff6b5e';
    text(r[0], bx+pad, y, F(1.0, true), '#d6e4ec');
    text(r[3], bx+pad, y+fs*1.1, F(0.78), r[4] ? '#ffb38a' : '#7f97a6');
    text(`${r[1]}`, bx+bw-pad-fs*2.4, y, F(1.25, true, true), c, 'right');
    text(`/${r[2]}`, bx+bw-pad, y, F(0.85, false, true), '#7f97a6', 'right');
    X.fillStyle = '#16303d'; X.fillRect(bx+pad, y+fs*1.8, bw-pad*2, 1);
  });
  const yb = by + fs*4.4 + 4*rh;
  text('区間得点', bx+pad, yb, F(1.05, true), '#eaf6ff');
  text(`${v.total}/100`, bx+bw-pad, yb, F(1.3, true, true), '#ffd166', 'right');
  text(`累計 ${S.totalScore} 点 ・ ${S.stationsVisited.length} 駅`, bx+pad, yb+fs*1.5, F(0.85), '#8fb3c6');
  // 確定
  const last = v.stationId === 0 && S.stationsVisited.length > 1;
  const kw = fs*9, kh = fs*2.3, kx = bx + (bw-kw)/2, ky = by + bh - kh - fs*0.9;
  const pulse = 0.75 + 0.25*Math.sin(performance.now()/300);
  X.fillStyle = `rgba(90,200,250,${0.22*pulse})`; rrect(kx, ky, kw, kh, 6); X.fill();
  X.strokeStyle = '#5ac8fa'; X.lineWidth = 2; rrect(kx, ky, kw, kh, 6); X.stroke();
  text(last ? '確定（結果へ）' : '確定', kx+kw/2, ky+kh*0.42, F(1.1, true), '#eaf6ff', 'center');
  text(TOUCH ? 'タップ' : 'Enter', kx+kw/2, ky+kh*0.8, F(0.6, false, true), '#8fb3c6', 'center');
  hit(kx, ky, kw, kh, departFromStation);
  X.textBaseline = 'alphabetic';
}

// 運行指示灯: pops up after 確定; driving (and the section clock) starts when it lights
function drawDepartSignal() {
  const lit = S.phase !== 'departing';
  if (!(S.phase === 'departing' || S.goFlash > 0)) return;
  const a = lit ? Math.min(1, S.goFlash/0.6) : 1;
  const bw = Math.min(LAY.winW*0.24, 300), bh = bw*0.62;
  const bx = LAY.winX + (LAY.winW - bw)/2, by = LAY.winY + LAY.winH*0.12;
  const fs = bw*0.065;
  X.globalAlpha = a;
  X.fillStyle = 'rgba(6,10,14,0.9)'; rrect(bx, by, bw, bh, 8); X.fill();
  X.strokeStyle = lit ? '#46e07a' : '#3a4a56'; X.lineWidth = 2; rrect(bx, by, bw, bh, 8); X.stroke();
  X.textBaseline = 'middle';
  text('運行指示灯', bx+bw/2, by+fs*1.5, `bold ${Math.floor(fs*1.15)}px ${JP}`, '#cfdbe3', 'center');
  const cx = bx+bw/2, cy = by+bh*0.52, r = bh*0.2;
  X.fillStyle = '#1a1f24'; X.beginPath(); X.arc(cx, cy, r*1.25, 0, Math.PI*2); X.fill();   // bezel
  if (lit) {
    X.shadowColor = '#46e07a'; X.shadowBlur = r*1.6;
    const g = X.createRadialGradient(cx-r*0.3, cy-r*0.3, r*0.1, cx, cy, r);
    g.addColorStop(0, '#d8ffe4'); g.addColorStop(0.5, '#4fe884'); g.addColorStop(1, '#1d9a4a');
    X.fillStyle = g;
  } else X.fillStyle = '#18331f';
  X.beginPath(); X.arc(cx, cy, r, 0, Math.PI*2); X.fill();
  X.shadowBlur = 0;
  const msg = lit ? '点灯 — 運転開始' : S.boardingTime > DEPART_T-1.2 ? '戸閉中…' : '点灯待ち…';
  text(msg, cx, by+bh-fs*1.5, `bold ${Math.floor(fs*1.05)}px ${JP}`, lit ? '#7ee0a8' : '#8fa3b0', 'center');
  X.textBaseline = 'alphabetic';
  X.globalAlpha = 1;
}

// ============================================================
// HINT BAR
// ============================================================
// Shown on the title screen and for the first seconds of a run, then it fades
// out of the way; H brings it back (and pins it).
const HINT = { until: 0, pinned: false };
function drawHintBar() {
  const y = LAY.hintY, h = H-LAY.hintY;
  const fs = Math.max(9, Math.min(W*0.0105, h*0.42));
  const items = ['↑ / W  ブレーキ (最上段 EB)', '↓ / S  力行', 'Space  非常制動', 'R  ノッチ戻し', 'Enter  確定',
                 'D / T / Y / Q  方向・時間帯・天候・画質', 'M  音声'];
  if (TOUCH) return;                 // touch devices get the gesture guide instead
  const a = S.phase === 'start' || HINT.pinned ? 1 : Math.max(0, Math.min(1, (HINT.until - performance.now())/1000));
  const step = W/(items.length+1);
  X.textBaseline = 'middle';
  if (a > 0) {
    X.globalAlpha = a;
    items.forEach((t, i) => text(t, step*(i+1), y+h*0.5, `${Math.floor(fs*0.92)}px ${JP}`, '#7b848c', 'center'));
    X.globalAlpha = 1;
  }
  if (a < 1) text('H  操作説明', W - fs*1.5, y+h*0.5, `${Math.floor(fs*0.85)}px ${JP}`,
                  `rgba(110,118,126,${(0.6*(1-a)).toFixed(2)})`, 'right');
  X.textBaseline = 'alphabetic';
}

// ============================================================
// TITLE PANEL (start screen)
// ============================================================
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function drawTitle() {
  const x = LAY.winX + LAY.winW*0.1, w = LAY.winW*0.8;
  const y = LAY.winY + LAY.winH*0.08, h = LAY.winH*0.84;
  X.fillStyle = 'rgba(4,10,14,0.85)'; rrect(x, y, w, h, 8); X.fill();
  X.strokeStyle = '#32d74b'; X.lineWidth = 2; rrect(x, y, w, h, 8); X.stroke();
  X.textBaseline = 'middle';
  text('山手線運転シミュレーター', x+w/2, y+h*0.16, `bold ${Math.floor(Math.min(h*0.12, w*0.06))}px ${JP}`, '#32d74b', 'center');
  text('YAMANOTE LINE TRAIN SIMULATOR', x+w/2, y+h*0.27, `${Math.floor(h*0.045)}px monospace`, '#7ea4c2', 'center');
  text(STATIONS.slice(0, 6).map(st => st.name).join(' → ') + ' → … 全30駅',
       x+w/2, y+h*0.36, `${Math.floor(h*0.045)}px ${JP}`, '#9fb4c2', 'center');
  // options: tap a button (or press its key) to cycle it
  const opts = [
    ['方向', ROUTE.name, 'D', nextRoute],
    ['時間帯', ENV.T.name, 'T', () => ENV.cycle('time')],
    ['天候', ENV.Wx.name, 'Y', () => ENV.cycle('wx')],
    ['画質', {auto: '自動', high: '高', low: '低'}[QUALITY], 'Q', cycleQuality],
  ];
  const bw = w*0.2, bh = h*0.15, gap = w*0.025, bx0 = x + (w - (bw*4 + gap*3))/2, by = y + h*0.45;
  const fs = Math.min(bh*0.3, bw*0.13);
  opts.forEach(([label, val, key, act], i) => {
    const bx = bx0 + i*(bw+gap);
    X.fillStyle = '#10232e'; rrect(bx, by, bw, bh, 6); X.fill();
    X.strokeStyle = '#3f7d99'; X.lineWidth = 1.5; rrect(bx, by, bw, bh, 6); X.stroke();
    text(TOUCH ? label : `${key}  ${label}`, bx+bw/2, by+bh*0.3, `${Math.floor(fs*0.85)}px ${JP}`, '#8fb3c6', 'center');
    text(val, bx+bw/2, by+bh*0.68, `bold ${Math.floor(fs*1.15)}px ${JP}`, '#eaf6ff', 'center');
    hit(bx, by, bw, bh, act);
  });
  // start
  const sw = w*0.36, sh = h*0.15, sx = x + (w-sw)/2, sy = y + h*0.68;
  X.globalAlpha = Math.sin(performance.now()/320)*0.25 + 0.75;
  X.fillStyle = '#3a2f0a'; rrect(sx, sy, sw, sh, 8); X.fill();
  X.strokeStyle = '#ffd166'; X.lineWidth = 2; rrect(sx, sy, sw, sh, 8); X.stroke();
  text(TOUCH ? 'タップして開始' : 'Press ENTER to start', sx+sw/2, sy+sh/2,
       `bold ${Math.floor(Math.min(sh*0.42, sw*0.08))}px ${TOUCH ? JP : 'monospace'}`, '#ffd166', 'center');
  X.globalAlpha = 1;
  hit(sx, sy, sw, sh, primaryAction);
  // iPhone/iPad Safari can't go full screen from a page — a home-screen icon can
  if (TOUCH && IOS && !navigator.standalone)
    text('全画面で遊ぶには：共有ボタン →「ホーム画面に追加」', x+w/2, y+h*0.92, `${Math.floor(h*0.042)}px ${JP}`, '#9fb4c2', 'center');
  X.textBaseline = 'alphabetic';
}

// ============================================================
// TOUCH CONTROLS — phones and tablets, landscape only. The master controller
// is driven by dragging its grip (see the pointer input); these add a 非常
// button, sound / help buttons and a gesture guide in place of the key list.
// ============================================================
function drawTouchUI() {
  if (!TOUCH || S.phase === 'start' || S.phase === 'result') return;
  // 非常 — big red button at the lower right of the windscreen, under the right thumb
  const r = Math.max(26, Math.min(W*0.045, LAY.winH*0.13));
  const ex = LAY.winX + LAY.winW - r*1.5, ey = LAY.winB - r*1.5;
  X.fillStyle = 'rgba(0,0,0,0.45)'; X.beginPath(); X.arc(ex, ey, r*1.12, 0, Math.PI*2); X.fill();
  const g = X.createRadialGradient(ex-r*0.3, ey-r*0.3, r*0.1, ex, ey, r);
  g.addColorStop(0, S.train.emergency ? '#ff8a7a' : '#e0473a'); g.addColorStop(1, '#8e1c14');
  X.fillStyle = g; X.beginPath(); X.arc(ex, ey, r, 0, Math.PI*2); X.fill();
  X.textBaseline = 'middle';
  text('非常', ex, ey, `bold ${Math.floor(r*0.55)}px ${JP}`, '#fff', 'center');
  hit(ex-r*1.1, ey-r*1.1, r*2.2, r*2.2, () => { if (canDrive()) emergencyBrake(); });
  // sound and help, top right of the windscreen
  const s = Math.max(30, r*0.9), iy = LAY.winY + s*0.3;
  [[AUDIO.on ? '🔊' : '🔇', () => AUDIO.toggle()], ['?', () => { HINT.pinned = !HINT.pinned; HINT.until = 0; }]]
    .forEach(([glyph, act], i) => {
      const ix = LAY.winX + LAY.winW - (i+1)*(s*1.25);
      X.fillStyle = 'rgba(6,10,14,0.6)'; rrect(ix, iy, s, s, 6); X.fill();
      text(glyph, ix+s/2, iy+s/2, `bold ${Math.floor(s*0.5)}px ${JP}`, '#eaf6ff', 'center');
      hit(ix, iy, s, s, act);
    });
  X.textBaseline = 'alphabetic';
  // gesture guide: for the first seconds of a run, or while ? is on
  const a = HINT.pinned ? 1 : Math.max(0, Math.min(1, (HINT.until - performance.now())/1000));
  if (a <= 0 || TIMS_BIG) return;
  const lines = ['主幹制御器の握りを上下にドラッグ — 上：ブレーキ ／ 下：力行',
                 '握りの上下をタップ — 1 段ずつ　　握りをダブルタップ — N',
                 '右下の「非常」 — 非常ブレーキ　　TIMS をタップ — 拡大表示'];
  const fs = Math.max(11, Math.min(W*0.016, LAY.winH*0.055)), pw = fs*26, ph = fs*5.2;
  const px = LAY.winX + (LAY.winW - pw)/2, py = LAY.winY + LAY.winH*0.06;
  X.globalAlpha = a;
  X.fillStyle = 'rgba(4,10,14,0.85)'; rrect(px, py, pw, ph, 8); X.fill();
  X.strokeStyle = '#5ac8fa'; X.lineWidth = 1.5; rrect(px, py, pw, ph, 8); X.stroke();
  X.textBaseline = 'middle';
  lines.forEach((t, i) => text(t, px+pw/2, py+fs*(1.3 + i*1.35), `${Math.floor(fs*0.92)}px ${JP}`, '#d6e4ec', 'center'));
  X.textBaseline = 'alphabetic';
  X.globalAlpha = 1;
}

// Phones are played sideways: in portrait, ask to rotate and hold the game.
function drawRotatePrompt() {
  X.fillStyle = '#05080b'; X.fillRect(0, 0, W, H);
  X.textBaseline = 'middle';
  const fs = Math.max(14, W*0.05);
  text('⟳', W/2, H*0.42, `${Math.floor(fs*3)}px ${JP}`, '#32d74b', 'center');
  text('画面を横向きにしてください', W/2, H*0.58, `bold ${Math.floor(fs)}px ${JP}`, '#eaf6ff', 'center');
  X.textBaseline = 'alphabetic';
}

// Quality: 'auto' drops to low (1× pixels, no blur filters, lighter weather)
// when the frame rate stays under ~40 fps for a few seconds of driving.
function cycleQuality() {
  QUALITY = {auto: 'high', high: 'low', low: 'auto'}[QUALITY];
  setLowQ(QUALITY === 'low');
}
function setLowQ(v) { if (LOWQ !== v) { LOWQ = v; resize(); } }
const FPS = { t: 0, n: 0 };
function watchFrameRate(dt) {
  if (QUALITY !== 'auto' || LOWQ || !canDrive()) { FPS.t = FPS.n = 0; return; }
  FPS.t += dt; FPS.n++;
  if (FPS.t >= 4) { if (FPS.n/FPS.t < 40) setLowQ(true); FPS.t = FPS.n = 0; }
}

// home-screen icon, drawn once at start-up (iOS reads apple-touch-icon)
function makeTouchIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#0d1a12'; x.fillRect(0, 0, 180, 180);
  x.lineWidth = 16; x.strokeStyle = '#9acd32'; x.beginPath(); x.arc(90, 90, 58, 0, Math.PI*2); x.stroke();
  x.fillStyle = '#fff'; x.font = `bold 58px ${JP}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('山', 90, 94);
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
  document.head.appendChild(l);
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  X.clearRect(0, 0, W, H);
  HIT.length = 0;
  CURVE.update();
  VPROF.update();
  SUN.update();
  // forward view, clipped to the windscreen, then rolled with the car body
  X.save();
  X.beginPath(); X.rect(LAY.winX, LAY.winY, LAY.winW, LAY.winH); X.clip();
  X.translate(CAM.cx, CAM.horizonY); X.rotate(-CAM.roll); X.translate(-CAM.cx, -CAM.horizonY);
  drawSky();
  drawCity();
  drawHorizonHaze();
  drawBallast();
  drawSpeedStreaks();
  drawBridgeShadows();
  drawRails(OPP_X, 130, true);
  drawRails(0, 130, false);
  drawCatenary();
  drawLineside();
  drawStations();   // platforms, trains and yard all queue depth chunks on DL…
  drawYard();
  drawOncoming();
  dlFlush();        // …painted together far -> near
  drawHeadlight();
  drawRain();
  X.restore();
  drawCabShell();
  // driver's desk
  drawConsole();
  drawMasterController();
  drawSpeedometer();
  drawGauges();
  drawLamps();
  drawTims();
  drawHintBar();
  drawTouchUI();
  if (TIMS_BIG) drawTims(true);
  if (S.phase === 'start') drawTitle();
  else { drawStopSummary(); drawDepartSignal(); }
}

// ============================================================
// SOUND — synthesised with Web Audio, no asset files. Starts on the first key
// press (browsers block audio until a user gesture); M mutes.
//   rolling noise and rail-joint clacks, E235 (SiC VVVF) motor whine under
//   power and regenerative braking, brake air and squeal, ATC bell on a limit
//   change, overspeed alarm, door chime, and 車内放送 via speech synthesis.
// ============================================================
const SPEAK_NAME = { '高輪GW': '高輪ゲートウェイ' };
const AUDIO = {
  ctx: null, on: true, phase: '', limit: 0, lever: 0, moving: false, alarmT: 0,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.out = c.createGain(); this.out.gain.value = 0.55; this.out.connect(c.destination);
    const len = c.sampleRate*2;
    this.white = c.createBuffer(1, len, c.sampleRate);
    this.brown = c.createBuffer(1, len, c.sampleRate);
    const w = this.white.getChannelData(0), b = this.brown.getChannelData(0);
    for (let i = 0, v = 0; i < len; i++) {
      w[i] = Math.random()*2 - 1;
      v = (v + 0.02*w[i])/1.02; b[i] = v*3.5;
    }
    const loop = (buf) => { const n = c.createBufferSource(); n.buffer = buf; n.loop = true; n.start(); return n; };
    // rolling: brown noise, low-passed, louder and brighter with speed
    this.rollF = c.createBiquadFilter(); this.rollF.type = 'lowpass';
    this.rollG = c.createGain(); this.rollG.gain.value = 0;
    loop(this.brown).connect(this.rollF).connect(this.rollG).connect(this.out);
    // motor: a magnetic hum that follows the rotor, plus the inverter's carrier whine
    this.humO = c.createOscillator(); this.humO.type = 'sawtooth';
    this.humF = c.createBiquadFilter(); this.humF.type = 'bandpass'; this.humF.Q.value = 3;
    this.whO = c.createOscillator(); this.whO.type = 'triangle';
    this.motG = c.createGain(); this.motG.gain.value = 0;
    this.humO.connect(this.humF).connect(this.motG);
    const wg = c.createGain(); wg.gain.value = 0.35; this.whO.connect(wg).connect(this.motG);
    this.motG.connect(this.out);
    this.humO.start(); this.whO.start();
    // brake squeal in the last metres of a stop
    this.sqO = c.createOscillator(); this.sqO.type = 'sine'; this.sqO.frequency.value = 3150;
    this.sqG = c.createGain(); this.sqG.gain.value = 0;
    this.sqO.connect(this.sqG).connect(this.out); this.sqO.start();
  },
  toggle() {
    this.on = !this.on;
    if (this.ctx) this.out.gain.setTargetAtTime(this.on ? 0.55 : 0, this.ctx.currentTime, 0.05);
    if (!this.on && window.speechSynthesis) speechSynthesis.cancel();
  },
  // one-shot: filtered noise burst
  burst(type, freq, q, gain, dur) {
    const c = this.ctx, t = c.currentTime, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.white; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f).connect(g).connect(this.out); n.start(t); n.stop(t + dur + 0.05);
  },
  // one-shot: a decaying tone
  tone(freq, gain, dur, type, delay) {
    const c = this.ctx, t = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.05);
  },
  knock(k, v) {                                   // ガタン: a click and a thump per axle
    if (!this.ctx || v <= 0.01) return;
    this.burst('bandpass', 1700, 1.2, 0.22*k*(0.3+v), 0.05);
    this.tone(85, 0.25*k*(0.3+v), 0.09, 'sine');
  },
  say(str) {
    if (!this.on || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(str);
    u.lang = 'ja-JP'; u.rate = 1.0; u.volume = 0.8;
    speechSynthesis.speak(u);
  },
  update(dt) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, tr = S.train;
    const live = S.phase !== 'start' && S.phase !== 'result';
    const v = live ? tr.speed : 0, vr = v/PHYSICS.MAX_SPEED;
    this.rollG.gain.setTargetAtTime(Math.min(1, vr*1.3)*0.32, t, 0.1);
    this.rollF.frequency.setTargetAtTime(160 + v*14, t, 0.1);
    // traction: power notches, or regenerative braking down to ~5 km/h
    const load = !live || tr.emergency ? 0 : tr.lever > 0 ? tr.lever/5 : tr.lever < 0 && v > 5 ? -tr.lever/8*0.7 : 0;
    this.motG.gain.setTargetAtTime(v > 0.3 || tr.lever > 0 ? load*0.07 : 0, t, 0.12);
    this.humO.frequency.setTargetAtTime(28 + v*9, t, 0.05);
    this.humF.frequency.setTargetAtTime(120 + v*22, t, 0.05);
    this.whO.frequency.setTargetAtTime(v < 32 ? 760 + v*22 : 1460 + (v-32)*5, t, 0.05);
    const braking = live && (tr.lever < 0 || tr.emergency);
    this.sqG.gain.setTargetAtTime(braking && v > 0 && v < 9 ? 0.012*(1 - v/9) : 0, t, 0.08);
    this.sqO.frequency.setTargetAtTime(3150 + Math.sin(t*23)*40, t, 0.02);
    if (!live) { this.phase = S.phase; this.moving = false; return; }
    // brake application: a short puff of air for each notch applied
    if (tr.lever < this.lever && tr.lever < 0) this.burst('highpass', 2600, 0.7, 0.05, 0.25);
    this.lever = tr.lever;
    // coming to a stand: the long プシュー as the brakes hold
    const moving = v > 0;
    if (this.moving && !moving) this.burst('highpass', 1800, 0.5, 0.09, 1.1);
    this.moving = moving;
    // ATC: a bell whenever the signalled limit changes, an alarm while over it
    const lim = getSpeedLimit(tr.position);
    if (this.limit && lim !== this.limit) { this.tone(1568, 0.12, 1.2); this.tone(2093, 0.07, 1.0); }
    this.limit = lim;
    this.alarmT -= dt;
    if (v > lim + 2 && this.alarmT <= 0) { this.tone(880, 0.06, 0.18, 'square'); this.alarmT = 0.5; }
    // doors and announcements on phase changes
    if (S.phase !== this.phase) {
      const next = STATIONS[(S.currentStation+1) % STATIONS.length], nm = SPEAK_NAME[next.name] || next.name;
      if (S.phase === 'stopped') {                      // doors open
        this.tone(1175, 0.08, 0.5); this.tone(880, 0.08, 0.7, 'sine', 0.35);
        const here = STATIONS[S.currentStation];
        this.say(`${SPEAK_NAME[here.name] || here.name}、${SPEAK_NAME[here.name] || here.name}。`);
      } else if (S.phase === 'departing') {             // doors close
        this.tone(880, 0.08, 0.4); this.tone(1175, 0.08, 0.6, 'sine', 0.3);
      } else if (S.phase === 'running' && this.phase === 'departing') {   // 運行指示灯 lit
        this.tone(1568, 0.07, 0.25); this.tone(1568, 0.07, 0.25, 'sine', 0.3);
        this.say(`次は、${nm}、${nm}。`);
      } else if (S.phase === 'approaching') {
        this.say(`まもなく、${nm}です。`);
      }
      this.phase = S.phase;
    }
  },
};

// ============================================================
// ROUTE — 外回り (品川→大崎→渋谷…, clockwise) or 内回り (品川→高輪GW→
// 田町…, anticlockwise), chosen on the title screen with D. Every
// position-keyed table is authored 外回り; for 内回り it is mirrored round the
// loop (x → TOTAL_LOOP − x) and re-ordered, and anything with a side swaps
// left and right. The train always runs toward increasing position.
// ============================================================
const OUTER = {
  stations: STATIONS.map(st => ({...st})), curves: CURVES.map(c => [...c]),
  profile: PROFILE.map(p => [...p]), districts: DISTRICTS.map(d => ({...d})),
  landmarks: LANDMARKS.map(l => ({...l})), bridges: [...BRIDGES], yard: [...YARD],
};
const ROUTE = {
  dir: 'outer', name: '外回り', hd0: 0,
  trainNo: '1185G',   // 列番: odd for 外回り, even for 内回り (placeholder numbers)
  set(dir) {
    const L = TOTAL_LOOP, inner = dir === 'inner', fill = (arr, items) => { arr.length = 0; arr.push(...items); };
    this.dir = dir; this.name = inner ? '内回り' : '外回り'; this.hd0 = inner ? Math.PI : 0;
    this.trainNo = inner ? '1184G' : '1185G';
    if (!inner) {
      fill(STATIONS, OUTER.stations.map(st => ({...st})));
      fill(CURVES, OUTER.curves.map(c => [...c]));
      fill(PROFILE, OUTER.profile.map(p => [...p]));
      fill(DISTRICTS, OUTER.districts.map(d => ({...d})));
      fill(LANDMARKS, OUTER.landmarks.map(l => ({...l})));
      fill(BRIDGES, OUTER.bridges);
      fill(YARD, OUTER.yard); YARD_SIDE = -1;
    } else {
      fill(STATIONS, OUTER.stations.map(st => ({...st, pos: (L - st.pos) % L}))
        .sort((a, b) => a.pos - b.pos).map((st, i) => ({...st, id: i})));
      fill(CURVES, OUTER.curves.map(([a, b, r, d]) => [L - b, L - a, r, -d]).reverse());
      fill(PROFILE, OUTER.profile.map(([x, e]) => [L - x, e]).reverse());
      fill(DISTRICTS, OUTER.districts.map((d, i) => ({...d, to: L - (i ? OUTER.districts[i-1].to : 0),
        forest: d.forest ? -d.forest : undefined})).reverse());
      fill(LANDMARKS, OUTER.landmarks.map(l => ({...l, pos: L - l.pos, x: -l.x})));
      fill(BRIDGES, OUTER.bridges.map(p => L - p - BR_D));
      fill(YARD, [L - OUTER.yard[1], L - OUTER.yard[0]]); YARD_SIDE = 1;
    }
    HEADING = buildHeading();
    buildTimetable();
  },
};

// ============================================================
// GAME LOOP
// ============================================================
let FRAME_DT = 1/60;   // the last frame's dt — renderers use it for motion blur
let lastTime = 0;
function loop(ts) {
  if (lastTime===0) lastTime=ts;
  let dt = (ts-lastTime)/1000;
  lastTime=ts;
  if (dt>0.1) dt=0.1;
  FRAME_DT = dt;
  if (TOUCH && H > W) { drawRotatePrompt(); requestAnimationFrame(loop); return; }
  watchFrameRate(dt);
  updateGame(dt);
  CABMOTION.update(dt);
  WIPER.update(dt);
  AUDIO.update(dt);
  render();
  requestAnimationFrame(loop);
}

function init() {
  resize();
  makeTouchIcon();
  buildTimetable();
  S.phase='start';
  OV.style.display='none';
  requestAnimationFrame(loop);
}
window.addEventListener('load', init);
window.addEventListener('resize', () => { resize(); if (S.phase==='start'||S.phase==='result') render(); });
</script>
</body>
</html>
