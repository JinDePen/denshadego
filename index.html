<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 「ホーム画面に追加」 then opens full screen, without browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山手線運転">
<meta name="theme-color" content="#000000">
<title>山手線運転シミュレーター - Yamanote Line Train Simulator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
/* the game sits inside the safe area, clear of notches and the home bar */
canvas { display:block; position:fixed; touch-action:none;
  left:env(safe-area-inset-left,0px); top:env(safe-area-inset-top,0px);
  width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); }
#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:none; justify-content:center; align-items:center;
  background:rgba(0,0,0,0.9); z-index:100; color:#ccd;
  font-family:'Courier New',monospace;
}
.overlay-inner { text-align:center; max-height:90vh; overflow-y:auto; padding:20px; }
.overlay-inner h1 { font-size:36px; color:#fc0; margin-bottom:12px; }
.rank-letter { font-size:72px; font-weight:bold; line-height:1; }
.rank-title { font-size:20px; margin-top:4px; }
.total-score { font-size:24px; color:#fff; margin:12px 0; }
.score-breakdown { font-size:14px; color:#aab; margin:10px 0; }
.score-breakdown div { margin:3px 0; }
.station-scores { margin-top:16px; text-align:left; max-height:40vh; overflow-y:auto; }
.station-scores h3 { text-align:center; color:#8ac; margin-bottom:8px; }
.station-row { display:flex; justify-content:space-between; padding:2px 8px; font-size:13px; border-bottom:1px solid #2a2a3a; }
.restart-hint { font-size:18px; color:#fc0; margin-top:20px; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<script>
// ============================================================
// 山手線運転シミュレーター - Cab View Edition
// ============================================================
const C = document.getElementById('c');
const X = C.getContext('2d');
const OV = document.getElementById('overlay');

let W, H;
// touch devices get on-screen controls; LOWQ trades sharpness and effects for frame rate
let TOUCH = window.matchMedia('(pointer: coarse)').matches;
let LOWQ = false, QUALITY = 'auto';   // 'auto' | 'high' | 'low'

// Draw in CSS pixels, back the canvas with device pixels (capped at 2×) so text
// and lines stay sharp on phones.
function resize() {
  W = C.clientWidth || window.innerWidth; H = C.clientHeight || window.innerHeight;
  const dpr = LOWQ ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  C.width = Math.round(W*dpr); C.height = Math.round(H*dpr);
  X.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// STATION DATA
// ============================================================
const TOTAL_LOOP = 34500;
const STATIONS = [
  { id:0,  name:"品川",     nameEn:"Shinagawa",          pos:0,     stopTime:40 },
  { id:1,  name:"大崎",     nameEn:"Osaki",              pos:2000,  stopTime:30 },
  { id:2,  name:"五反田",   nameEn:"Gotanda",            pos:2900,  stopTime:30 },
  { id:3,  name:"目黒",     nameEn:"Meguro",             pos:4100,  stopTime:30 },
  { id:4,  name:"恵比寿",   nameEn:"Ebisu",              pos:5600,  stopTime:35 },
  { id:5,  name:"渋谷",     nameEn:"Shibuya",            pos:7200,  stopTime:45 },
  { id:6,  name:"原宿",     nameEn:"Harajuku",           pos:8400,  stopTime:30 },
  { id:7,  name:"代々木",   nameEn:"Yoyogi",             pos:9900,  stopTime:30 },
  { id:8,  name:"新宿",     nameEn:"Shinjuku",           pos:10600, stopTime:50 },
  { id:9,  name:"新大久保", nameEn:"Shin-Okubo",         pos:11900, stopTime:30 },
  { id:10, name:"高田馬場", nameEn:"Takadanobaba",       pos:13300, stopTime:30 },
  { id:11, name:"目白",     nameEn:"Mejiro",             pos:14200, stopTime:30 },
  { id:12, name:"池袋",     nameEn:"Ikebukuro",          pos:15400, stopTime:50 },
  { id:13, name:"大塚",     nameEn:"Otsuka",             pos:17200, stopTime:30 },
  { id:14, name:"巣鴨",     nameEn:"Sugamo",             pos:18300, stopTime:30 },
  { id:15, name:"駒込",     nameEn:"Komagome",           pos:19000, stopTime:30 },
  { id:16, name:"田端",     nameEn:"Tabata",             pos:20600, stopTime:35 },
  { id:17, name:"西日暮里", nameEn:"Nishi-Nippori",      pos:21400, stopTime:30 },
  { id:18, name:"日暮里",   nameEn:"Nippori",            pos:21900, stopTime:35 },
  { id:19, name:"鶯谷",     nameEn:"Uguisudani",         pos:23000, stopTime:30 },
  { id:20, name:"上野",     nameEn:"Ueno",               pos:24100, stopTime:45 },
  { id:21, name:"御徒町",   nameEn:"Okachimachi",        pos:24700, stopTime:30 },
  { id:22, name:"秋葉原",   nameEn:"Akihabara",          pos:25700, stopTime:40 },
  { id:23, name:"神田",     nameEn:"Kanda",              pos:26400, stopTime:30 },
  { id:24, name:"東京",     nameEn:"Tokyo",              pos:27700, stopTime:60 },
  { id:25, name:"有楽町",   nameEn:"Yurakucho",          pos:28500, stopTime:30 },
  { id:26, name:"新橋",     nameEn:"Shimbashi",          pos:29600, stopTime:35 },
  { id:27, name:"浜松町",   nameEn:"Hamamatsucho",       pos:30800, stopTime:30 },
  { id:28, name:"田町",     nameEn:"Tamachi",            pos:32300, stopTime:30 },
  { id:29, name:"高輪GW",   nameEn:"Takanawa Gateway",   pos:33600, stopTime:30 },
];

// ============================================================
// PHYSICS
// ============================================================
const GRADE_ACC = 9.8*3.6/1000;   // km/h/s of gravity per ‰ of gradient
const PHYSICS = {
  MAX_SPEED: 90,
  ACCEL_MAX: 3.0,   // at P5
  BRAKE_MAX: 4.0,   // at B8
  BRAKE_EMG: 5.2,
  COAST_DECEL: 0.3,
};

// ============================================================
// GAME STATE
// ============================================================
const S = {
  phase: 'start',
  train: { position:0, speed:0, lever:0, emergency:false },
  // lever: -8(B8)..0(N)..+5(P5). Positive=power, negative=brake, 0=neutral.
  // On screen the handle runs EB/B8..B1 at the TOP, N, then P1..P5 DOWNWARD.
  currentStation: 0,
  stationsVisited: [],
  totalScore: 0,
  elapsedTime: 0,     // running time over the lap (the TIMS clock)
  segTime: 0,         // running time since this section's 運行指示灯 lit
  boardingTime: 0,    // 'departing': countdown until the 運行指示灯 lights
  goFlash: 0,         // seconds the lit lamp stays on screen after it lights
  prevAccel: 0,
  speedViolations: 0,
  comfortViolations: 0,
  lastViolationCheck: 0,
};

// ============================================================
// HELPERS (unchanged game logic)
// ============================================================
function loopPos(p) { return p % TOTAL_LOOP; }
function getNextStationIndex(pos) {
  const lp = loopPos(pos);
  for (let i = 0; i < STATIONS.length; i++) if (STATIONS[i].pos > lp) return i;
  return 0;
}
function distanceToNextStation(pos) {
  const lp = loopPos(pos), si = getNextStationIndex(pos), sp = STATIONS[si].pos;
  if (sp > lp) return sp - lp;
  return (TOTAL_LOOP - lp) + sp;
}
// Speed limits come from track geometry alone: each curve zone carries a limit
// set by its radius, active from the curve's start to its end; on straight
// track (and through stations) the 90 km/h line speed applies.
// Curve speed limit from the standard curving-speed formula for narrow gauge:
// V² = 127·R·(C + Cd) / G, with the regulation figures for 在来線 — cant C up
// C (see CANT below) and a permitted cant deficiency Cd of 60 mm for ordinary trains,
// G ≈ 1120 mm between rail centres — rounded down to 5 km/h and capped at the
// line's ATC maximum of 90 km/h. JR does not publish the Yamanote's actual
// per-curve limits. Cant is set below the 105 mm maximum, to 80 mm: urban
// commuter curves usually carry less cant than the regulation allows.
const CANT = 80, CANT_DEF = 60, RAIL_G = 1120;
function curveLimitOf(r) {
  const v = Math.sqrt(127*r*(CANT + CANT_DEF)/RAIL_G);
  return Math.min(PHYSICS.MAX_SPEED, Math.floor(v/5)*5);
}
function getSpeedLimit(pos) {
  const lp = loopPos(pos);
  for (const c of CURVES) {
    if (lp >= c[0] && lp <= c[1]) {
      const l = curveLimitOf(c[2]);
      if (l < 90) return l;
    }
  }
  return 90;   // line speed
}
// Nearest restricting curve ahead, for the TIMS advance display.
function getNextCurveLimit(pos) {
  const lp = loopPos(pos);
  let best = null;
  for (const c of CURVES) {
    const l = curveLimitOf(c[2]);
    if (l >= 90) continue;
    let d = c[0] - lp;
    if (d < 0) d += TOTAL_LOOP;
    if (d < 600 && (!best || d < best.dist)) best = { limit: l, dist: d };
  }
  return best;
}
function formatTime(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function evaluateStopScore(err) {
  if (err < 0.3) return 40; if (err < 0.5) return 38;
  if (err < 1.0) return 35; if (err < 2.0) return 30;
  if (err < 3.0) return 25; if (err < 5.0) return 20;
  if (err < 8.0) return 10; if (err < 15.0) return 5;
  return 0;
}
// 運転時分 — each section's scheduled running time, worked out from the train's
// own performance driven the way a real driver does rather than flat out:
// about P4 acceleration, service braking about B6, a few km/h under every
// limit, plus 余裕時分 (recovery margin), rounded up to 5 s. Built at load from
// the track itself, so it always matches the curves and their limits.
const RUN_ACC = 2.5, RUN_BRK = 2.8;   // km/h/s
const RUN_MARGIN = 3;                 // km/h held under each limit
const RUN_SLACK = 1.08;               // 余裕時分
let LOOP_TIME = 0;                    // due time for the full lap, back into 品川
function sectionRunTime(i) {
  const a = STATIONS[i].pos, b = i+1 < STATIONS.length ? STATIONS[i+1].pos : TOTAL_LOOP;
  const n = Math.round(b - a), A = RUN_ACC/3.6, B = RUN_BRK/3.6, v = new Float64Array(n+1);
  const g = (p) => gradeAt(p)*GRADE_ACC/3.6;                    // gravity along the gradient, m/s²
  for (let k = 1; k <= n; k++)                                  // accelerate, capped by the limit
    v[k] = Math.min((getSpeedLimit(a+k) - RUN_MARGIN)/3.6, Math.sqrt(Math.max(0, v[k-1]*v[k-1] + 2*(A - g(a+k)))));
  v[n] = 0;
  for (let k = n-1; k >= 0; k--)                                // brake in time (a climb helps)
    v[k] = Math.min(v[k], Math.sqrt(Math.max(0, v[k+1]*v[k+1] + 2*(B + g(a+k)))));
  let t = 0;
  for (let k = 1; k <= n; k++) t += 2/(v[k] + v[k-1] || 1e-9);
  return t;
}
function buildTimetable() {
  let t = 0;
  STATIONS.forEach((st, i) => { st.time = t; t += Math.ceil(sectionRunTime(i)*RUN_SLACK/5)*5; });
  LOOP_TIME = t;
}
function stationDueTime(sid) { return sid===0 ? LOOP_TIME : STATIONS[sid].time; }
// scheduled running time of the section that ends at station sid
function sectionDue(sid) {
  const prev = (sid + STATIONS.length - 1) % STATIONS.length;
  return stationDueTime(sid) - STATIONS[prev].time;
}
// each section is timed on its own, from its 運行指示灯 to the stop;
// only lateness costs points — arriving early is not penalised
function getTimeScore(sid, segTime) {
  const e = Math.max(0, segTime - sectionDue(sid));
  if (e <= 5) return 10; if (e <= 10) return 8;
  if (e <= 15) return 7; if (e <= 20) return 5;
  if (e <= 30) return 3; return 0;
}
function getRank(sc) {
  const p = sc/3000;
  if (p>=0.95) return {rank:'S',title:'鉄道マスター',color:'#FFD700'};
  if (p>=0.90) return {rank:'A',title:'優秀運転士',color:'#FF6347'};
  if (p>=0.80) return {rank:'B',title:'一人前運転士',color:'#1E90FF'};
  if (p>=0.65) return {rank:'C',title:'見習い運転士',color:'#3CB371'};
  return {rank:'D',title:'要再訓練',color:'#808080'};
}

// ============================================================
// GAME FLOW (unchanged)
// ============================================================
// Each section: stop → score summary (wait for 確定) → doors close → the
// 運行指示灯 lights → only then can the train be driven and the clock runs.
const DEPART_T = 3.2;        // seconds from 確定 until the 運行指示灯 lights
const ARRIVE_ZONE = 10;      // halting within this many metres short of the line is a clean stop
const OVERRUN_MAX = 120;     // halting past the line still arrives (with a penalty) up to here
const OVERRUN_PENALTY = 15;  // stop-score points lost for halting past the line
function startGame() {
  S.phase='departing'; S.train.position=0; S.train.speed=0;
  S.train.lever=0; S.train.emergency=false;
  S.currentStation=0; S.stationsVisited=[]; S.totalScore=0; S.elapsedTime=0; S.segTime=0;
  S.boardingTime=DEPART_T; S.goFlash=0; S.prevAccel=0; S.speedViolations=0; S.comfortViolations=0;
  S.lastViolationCheck=0;
  OV.style.display='none'; OV.innerHTML='';
}
// 確定 on the stop summary: close the doors and wait for the 運行指示灯
function departFromStation() {
  if (S.phase!=='stopped') return;
  if (S.currentStation===0 && S.stationsVisited.length>1) { S.phase='result'; showResult(); return; }
  S.phase='departing'; S.boardingTime=DEPART_T;
  S.speedViolations=0; S.comfortViolations=0; S.prevAccel=0;
}
function arriveAtStation() {
  // The target is always the station after the current one — getNextStationIndex
  // would skip ahead if the train has rolled past the stop line.
  const si = (S.currentStation+1) % STATIONS.length;
  let sd = STATIONS[si].pos - loopPos(S.train.position);
  if (sd >  TOTAL_LOOP/2) sd -= TOTAL_LOOP;
  if (sd < -TOTAL_LOOP/2) sd += TOTAL_LOOP;
  const stopError = Math.abs(sd);
  let stopScore = evaluateStopScore(stopError);
  if (sd < 0) stopScore = Math.max(0, stopScore - OVERRUN_PENALTY);   // halted past the line
  const speedScore = Math.max(0, 30 - S.speedViolations*5);
  const comfortScore = Math.max(0, 20 - S.comfortViolations*3);
  const timeScore = getTimeScore(si, S.segTime);
  const st = stopScore+speedScore+comfortScore+timeScore;
  S.totalScore += st;
  S.stationsVisited.push({stationId:si,name:STATIONS[si].name,scores:{stop:stopScore,speed:speedScore,comfort:comfortScore,time:timeScore},total:st,
    stopErr:sd, segTime:S.segTime, segDue:sectionDue(si), speedV:S.speedViolations, comfortV:S.comfortViolations});
  S.currentStation = si;
  S.phase='stopped';   // the summary stays up until the driver presses 確定
}
function showResult() {
  const r = getRank(S.totalScore);
  let h=`<div class="overlay-inner"><h1>一周完了！</h1>`;
  h+=`<div style="color:${r.color}"><div class="rank-letter">${r.rank}</div><div class="rank-title">${r.title}</div></div>`;
  h+=`<div class="total-score">総合得点: ${S.totalScore} / 3000</div>`;
  h+=`<div class="score-breakdown">`;
  const ts=S.stationsVisited.reduce((a,v)=>a+v.scores.stop,0);
  const tss=S.stationsVisited.reduce((a,v)=>a+v.scores.speed,0);
  const tc=S.stationsVisited.reduce((a,v)=>a+v.scores.comfort,0);
  const tt=S.stationsVisited.reduce((a,v)=>a+v.scores.time,0);
  h+=`<div>停止精度: ${ts}/${S.stationsVisited.length*40}</div>`;
  h+=`<div>速度遵守: ${tss}/${S.stationsVisited.length*30}</div>`;
  h+=`<div>乗り心地: ${tc}/${S.stationsVisited.length*20}</div>`;
  h+=`<div>定時性:   ${tt}/${S.stationsVisited.length*10}</div></div>`;
  h+=`<div class="station-scores"><h3>駅別成績</h3>`;
  for(const v of S.stationsVisited) h+=`<div class="station-row"><span>${v.name}</span><span>${v.total}/100</span></div>`;
  h+=`</div><div class="restart-hint">Press ENTER to restart</div></div>`;
  OV.innerHTML=h; OV.style.display='flex';
}

// ============================================================
// INPUT (unchanged)
// ============================================================
// Lever actions, shared by the keyboard and the touch controls.
function canDrive() { return S.phase === 'running' || S.phase === 'approaching'; }   // 運行指示灯 lit
function leverUp() {          // handle up = brake side; one step past B8 is the EB position at the top
  if (S.train.emergency) return;
  if (S.train.lever <= -8) S.train.emergency = true; else S.train.lever--;
}
function leverDown() {        // handle down = power side; leaving EB drops back to B8 first
  if (S.train.emergency) { S.train.emergency = false; S.train.lever = -8; }
  else S.train.lever = Math.min(5, S.train.lever + 1);
}
function leverNeutral() { S.train.lever = 0; S.train.emergency = false; }
function emergencyBrake() { S.train.emergency = true; S.train.lever = -8; }
// put the handle straight into notch i (0 = EB at the top, 9 = N, 14 = P5)
function setNotch(i) {
  i = Math.max(0, Math.min(NOTCHES.length-1, i));
  const was = S.train.emergency ? 0 : 9 + S.train.lever;
  if (i === was) return;
  if (i === 0) emergencyBrake(); else { S.train.emergency = false; S.train.lever = i - 9; }
  if (navigator.vibrate) navigator.vibrate(8);    // a click for each notch (Android)
}
// Enter / tap: start from the title, 確定 on the summary, back to the title after the lap
function primaryAction() {
  if (S.phase === 'start') {
    startGame(); HINT.until = performance.now() + 8000;
    if (TOUCH && document.documentElement.requestFullscreen && !document.fullscreenElement)
      document.documentElement.requestFullscreen().then(() => screen.orientation && screen.orientation.lock &&
        screen.orientation.lock('landscape')).catch(() => {});
  } else if (S.phase === 'result') { S.phase = 'start'; OV.style.display = 'none'; OV.innerHTML = ''; }
  else if (S.phase === 'stopped') departFromStation();
}
function nextRoute() { if (S.phase === 'start') ROUTE.set(ROUTE.dir === 'outer' ? 'inner' : 'outer'); }

window.addEventListener('keydown', (e) => {
  if (e.key==='Enter'||e.key===' ') e.preventDefault();
  AUDIO.init();                       // audio may only start from a user gesture
  if (e.key==='m' || e.key==='M') AUDIO.toggle();
  if (e.key==='h' || e.key==='H') HINT.pinned = !HINT.pinned;
  if (e.key==='t' || e.key==='T') ENV.cycle('time');
  if (e.key==='y' || e.key==='Y') ENV.cycle('wx');
  if (e.key==='d' || e.key==='D') nextRoute();
  if ((e.key==='q' || e.key==='Q') && S.phase==='start') cycleQuality();
  if (e.key==='Enter') { primaryAction(); return; }
  if (!canDrive()) return;            // no driving until the 運行指示灯 lights
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': leverUp(); break;
    case 'ArrowDown': case 's': case 'S': leverDown(); break;
    case ' ': emergencyBrake(); break;
    case 'r': case 'R': leverNeutral(); break;
  }
});

// Pointer input (touch and mouse). Renderers push tappable rects onto HIT each
// frame; the master controller is handled separately so its grip can be dragged.
const HIT = [];
let DRAG = null, lastGripTap = 0, TIMS_BIG = false;
function hit(x, y, w, h, act) { HIT.push({x, y, w, h, act}); }
C.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') TOUCH = true;
  AUDIO.init();
  const x = e.offsetX, y = e.offsetY;
  if (TIMS_BIG) { TIMS_BIG = false; return; }       // any tap closes the enlarged TIMS
  for (let i = HIT.length-1; i >= 0; i--) {
    const h = HIT[i];
    if (x >= h.x && x <= h.x+h.w && y >= h.y && y <= h.y+h.h) { h.act(); return; }
  }
  const g = ctrlGeom();
  if (!canDrive() || x < g.x0 || x > g.x1 || y < g.py - g.L || y > g.by) return;
  if (y > g.gy - g.stepY*2 && y < g.hy + g.stepY*1.5) {            // on the grip or shaft: grab it
    const now = performance.now();
    if (now - lastGripTap < 320) { leverNeutral(); lastGripTap = 0; return; }   // double tap = N
    lastGripTap = now;
    DRAG = {id: e.pointerId, y0: y, i0: g.idx};
    C.setPointerCapture(e.pointerId);
  } else (y < g.hy ? leverUp : leverDown)();                      // tap above / below: one notch
});
C.addEventListener('pointermove', (e) => {
  if (!DRAG || e.pointerId !== DRAG.id || !canDrive()) return;
  const g = ctrlGeom();
  // a notch every 14 px at least: on a phone the drawn scale is only ~5 px a notch
  setNotch(DRAG.i0 + Math.round((e.offsetY - DRAG.y0)/Math.max(g.stepY, 14)));
});
const endDrag = (e) => { if (DRAG && e.pointerId === DRAG.id) DRAG = null; };
C.addEventListener('pointerup', endDrag);
C.addEventListener('pointercancel', endDrag);
OV.addEventListener('pointerdown', () => { if (S.phase === 'result') primaryAction(); });   // tap to restart

// ============================================================
// PHYSICS UPDATE (unchanged)
// ============================================================
function updatePhysics(dt) {
  const t = S.train; let a = 0;
  if (t.emergency) a = -PHYSICS.BRAKE_EMG;
  else if (t.lever < 0) a = -PHYSICS.BRAKE_MAX * (-t.lever / 8);   // brake B1..B8
  else if (t.lever > 0) a = PHYSICS.ACCEL_MAX * (t.lever / 5);      // power P1..P5
  else a = -PHYSICS.COAST_DECEL;                                     // neutral coast
  a -= gradeAt(t.position)*GRADE_ACC;                               // 勾配: 34‰ ≈ 1.2 km/h/s
  t.speed = Math.max(0, Math.min(PHYSICS.MAX_SPEED, t.speed+a*dt));
  t.position += (t.speed/3.6)*dt;
  return a;
}

// ============================================================
// GAME STATE UPDATE (unchanged)
// ============================================================
function updateGame(dt) {
  if (S.phase==='start'||S.phase==='result') return;
  S.worldTime = (S.worldTime||0) + dt;   // keeps opposing services moving while we stand
  if (S.phase==='departing') {
    S.boardingTime -= dt;
    if (S.boardingTime <= 0) { S.phase='running'; S.segTime=0; S.goFlash=1.8; }   // 運行指示灯 lit
    return;
  }
  if (S.phase==='stopped') return;   // waiting for 確定 on the summary
  S.elapsedTime += dt; S.segTime += dt;
  if (S.goFlash > 0) S.goFlash -= dt;
  const accel = updatePhysics(dt);
  S.lastViolationCheck += dt;
  if (S.lastViolationCheck>0.5) {
    S.lastViolationCheck=0;
    if (S.train.speed > getSpeedLimit(S.train.position)+2) S.speedViolations++;
  }
  const pa=S.prevAccel; S.prevAccel=accel;
  if (Math.abs(accel-pa)>5.0 && S.train.speed>5) S.comfortViolations++;
  const dist = distanceToNextStation(S.train.position);
  if (dist<800 && S.phase==='running') S.phase='approaching';
  // Signed distance to the target's stop line (negative = already past it).
  // Halting within ARRIVE_ZONE short of the line is a clean arrival; halting past
  // it still arrives, with a penalty. Running OVERRUN_MAX beyond misses the stop.
  const ti = (S.currentStation+1) % STATIONS.length;
  let sd = STATIONS[ti].pos - loopPos(S.train.position);
  if (sd >  TOTAL_LOOP/2) sd -= TOTAL_LOOP;
  if (sd < -TOTAL_LOOP/2) sd += TOTAL_LOOP;
  if (S.phase==='approaching' && sd < -OVERRUN_MAX) {
    S.phase='running';
    S.currentStation = ti;   // station missed — everything now targets the next one
  }
  if (S.train.speed===0 && sd <= ARRIVE_ZONE && sd >= -OVERRUN_MAX && (S.train.lever < 0 || S.phase==='approaching'))
    arriveAtStation();
}

// ============================================================
// CAB LAYOUT — windscreen / console / hint bar
// ============================================================
const LAY = {
  get winX() { return W*0.045; },
  get winY() { return H*0.055; },
  get winW() { return W*0.91; },
  get winH() { return H*0.545; },
  get winB() { return this.winY + this.winH; },
  get conY() { return this.winB; },
  get conH() { return H*0.335; },
  get hintY() { return this.conY + this.conH; },
};

// ============================================================
// CAMERA — pinhole projection. ALL world units are metres:
//   x = lateral offset from track centre (+ = right)
//   y = height above rail head (+ = up)
//   z = distance ahead of the driver's eye
// Screen x = cx + f*x/z ; screen y = horizon + f*(eye-y)/z
// ============================================================
const CAM = {
  EYE_H: 2.6,   // driver's eye above rail head
  NEAR: 7,      // nearest z we draw (closer is hidden by the train nose)
  dx: 0, dy: 0, pitch: 0, roll: 0,   // cab body motion (m, m, rad, rad) — set by CABMOTION
  get f() { return W*0.80; },
  get cx() { return W*0.5; },
  get horizonY() { return LAY.winY + LAY.winH*0.45 + this.f*this.pitch; },
  project(x, y, z) {
    const s = this.f/z;                     // pixels per metre at this depth
    return { x: this.cx + (x + CURVE.at(z) - this.dx)*s, y: this.horizonY + (this.EYE_H + this.dy - y - VPROF.at(z))*s, s:s };
  },
};

// ============================================================
// TRACK CURVATURE — the loop bends like the real line.
// [from, to, radius, dir] on the loop; dir +1 curves right, -1 left.
// The whole world is projected through CURVE.at(z), so track, platforms
// and city all bend together. The train runs 外回り (品川→大崎→渋谷…),
// clockwise round the loop, hence the rightward bias.
// Curves are measured from the real track: OpenStreetMap's JR山手線 route
// geometry, walked 外回り, curvature taken over ±30 m, kept where R < 2000 m
// and the turn is at least 8°. R is the radius of the tightest part (where
// curvature is within 80% of its peak — 品川→大崎 comes out R350, the

const CURVES = [

  [960, 1880, 350, +1],   // 品川→大崎 136°
  [2890, 3240, 600, -1],  // 五反田→目黒 30°
  [3480, 3880, 400, +1],  // 五反田→目黒 51°
  [4470, 4650, 300, -1],  // 目黒→恵比寿 25°

  [6070, 6270, 750, -1],  // 恵比寿→渋谷 11°

  [7190, 7420, 450, +1],  // 渋谷→原宿 28°
  [8890, 9050, 450, -1],  // 原宿→代々木 17°
  [9180, 9350, 1200, -1], // 原宿→代々木 9°
  [9620, 9720, 500, -1],  // 原宿→代々木 9°
  [9780, 9870, 350, +1],  // 代々木構内 10°
  [10640, 10840, 750, +1], // 新宿→新大久保 12°
  [10910, 11030, 400, -1], // 新宿→新大久保 12°
  [11190, 11430, 400, +1], // 新宿→新大久保 26°
  [11510, 11640, 500, -1], // 新宿→新大久保 8°
  [12100, 12280, 850, +1], // 新大久保→高田馬場 10°
  [15580, 16280, 450, +1], // 池袋→大塚 84°
  [17400, 17830, 450, -1], // 大塚→巣鴨 44°
  [19760, 20300, 300, +1], // 駒込→田端 78°
  [21100, 21280, 950, +1], // 西日暮里構内 9°
  [22240, 22400, 700, +1], // 日暮里→鶯谷 12°
  [23150, 23610, 300, +1], // 鶯谷→上野 76°
  [24230, 24440, 300, -1], // 上野→御徒町 39°
  [24470, 24590, 450, +1], // 御徒町構内 17°
  [25260, 25380, 650, -1], // 御徒町→秋葉原 8°
  [25860, 26020, 650, +1], // 秋葉原→神田 11°
  [28140, 28390, 400, +1], // 東京→有楽町 28°
  [28670, 28900, 600, -1], // 有楽町→新橋 21°
  [29250, 29530, 450, -1], // 新橋構内 31°
  [30020, 30250, 1050, +1], // 新橋→浜松町 11°
  [31050, 31550, 500, +1], // 浜松町→田町 31°
  [31560, 31770, 600, +1], // 浜松町→田町 15°
  [32530, 32930, 400, -1], // 田町→高輪GW 44°
  [33000, 33090, 450, +1], // 田町→高輪GW 8°
  [34190, 34440, 500, -1], // 品川構内 21°

function curvatureAt(p) {
  const lp = loopPos(p);
  for (const c of CURVES) {
    if (lp >= c[0]-80 && lp <= c[1]+80) {   // 80 m clothoid ramp at each end
      const t = Math.min(1, (lp-c[0]+80)/80, (c[1]+80-lp)/80);
      return t * c[3] / c[2];

const CURVE = {
  step: 4, n: 0, offs: null, lastHead: 0,
  update() {   // integrate curvature ahead of the train, once per frame
    if (!this.offs) { this.n = Math.ceil(FAR/this.step)+2; this.offs = new Float32Array(this.n); }
    let head = 0, off = 0;
    const p0 = S.train.position;
    for (let i=0;i<this.n;i++) {
      this.offs[i] = off;
      head += curvatureAt(p0 + i*this.step) * this.step;
      off  += head * this.step;
    }
    this.lastHead = head;
  },
  at(z) {
    if (!this.offs || z <= 0) return 0;
    const zm = (this.n-1)*this.step;
    if (z >= zm) return this.offs[this.n-1] + this.lastHead*(z-zm);  // landmarks beyond FAR
    const i = z/this.step, i0 = i|0, f = i-i0;
    return this.offs[i0]*(1-f) + this.offs[i0+1]*f;

// ============================================================
// TRACK PROFILE — 勾配. Rail-level elevation (m) at breakpoints along the loop,
// constant gradient between them. Built from the GSI (国土地理院) 1 m laser
// elevation model sampled every 50 m along the OSM track, smoothed over
// ±250 m and fitted with gradient sections of at least 250 m. It follows the
// ground, so cuttings are right but viaducts are not lifted. One exception is
// added by hand: 西日暮里 is an elevated station squeezed in (1971) between
// ground-level 田端 and 日暮里, so 外回り climbs to it at 34‰ — the steepest
// grade on the line — and drops away at about 29‰. The ramp lengths and the
// station's rail height are not published; they are set so the 34‰ / 29‰
// figures hold and both platforms stay level.
// ============================================================
const PROFILE = [
  [0, 3.1], [1270, 6.4], [1900, 3.7], [2660, 4.5], [3070, 8.1], [3580, 15.2],
  [3830, 22.4], [4140, 26.2], [4800, 27.6], [5520, 19.5], [5940, 17.3], [7110, 15.6],
  [8700, 30.7], [9320, 33.3], [9760, 37.4], [10390, 36.0], [11280, 38.0], [12110, 33.0],
  [13440, 21.1], [13900, 23.0], [15000, 31.4], [15340, 32.3], [16110, 25.3], [17060, 24.5],
  [18090, 20.6], [18650, 20.0], [19260, 15.0], [19830, 14.8], [20450, 7.4], [20720, 5.9],
  [20830, 5.9], [21130, 16.1], [21430, 16.1], [21740, 7.1],   // 田端→西日暮里 34‰, 西日暮里 level, 29‰ down
  [21960, 6.6], [23930, 11.0], [24400, 4.4], [24720, 3.2], [26360, 4.8],
  [28830, 2.6], [30210, 4.7], [30590, 3.6], [31530, 6.0], [32320, 3.3], [34500, 3.1],
];
function elevAt(p) {
  const lp = loopPos(p);
  for (let i = 1; i < PROFILE.length; i++)
    if (lp <= PROFILE[i][0]) {
      const [a, ea] = PROFILE[i-1], [b, eb] = PROFILE[i];
      return ea + (eb-ea)*(lp-a)/(b-a);
    }

}
// gradient in ‰, + = climbing in the direction of travel
function gradeAt(p) {
  const lp = loopPos(p);
  for (let i = 1; i < PROFILE.length; i++)
    if (lp <= PROFILE[i][0]) return (PROFILE[i][1]-PROFILE[i-1][1])/(PROFILE[i][0]-PROFILE[i-1][0])*1000;
  return 0;
}
// The cab sits on the local gradient, so only the CHANGE of gradient ahead is
// visible: VPROF.at(z) is how far the rail at z rises above the cab's own slope.
const VPROF = {
  step: 4, n: 0, offs: null, slope: 0,
  update() {
    if (!this.offs) { this.n = Math.ceil(FAR/this.step)+2; this.offs = new Float32Array(this.n); }
    const p0 = S.train.position, e0 = elevAt(p0);
    this.slope = (elevAt(p0+5) - elevAt(p0-5))/10;
    for (let i = 0; i < this.n; i++) this.offs[i] = elevAt(p0 + i*this.step) - e0 - this.slope*i*this.step;
  },
  at(z) {
    if (!this.offs || z <= 0) return 0;
    const i = z/this.step, i0 = Math.min(i|0, this.n-2), f = Math.min(1, i-i0);
    return this.offs[i0]*(1-f) + this.offs[i0+1]*f;
  },
};

// ============================================================
// CAB MOTION — the body rides on springs, so the view is never still.
//   pitch  lags the applied power/brake, and rocks back as the train halts
//   roll   leans into curves with the cant, plus a slow hunting sway
//   dy     rail-joint knocks as each axle crosses a joint (every RAIL_LEN)
//   dx     lateral sway from track irregularity
// Everything but the pitch spring is keyed to position, so a standing train is still.
// ============================================================
const RAIL_LEN = 25;
const AXLES = [[2.5,1], [4.6,1], [16.3,0.45], [18.4,0.45]];   // metres behind the eye, knock strength
const CABMOTION = {
  pv: 0, bv: 0, lastPos: 0,
  update(dt) {
    const t = S.train, p = t.position, v = t.speed/PHYSICS.MAX_SPEED;
    const acc = t.speed > 0 ? S.prevAccel : 0;
    // braking dips the nose (horizon rises); under-damped so a halt rocks back
    this.pv += ((acc*0.0016 - CAM.pitch)*28 - this.pv*4.2) * dt;
    CAM.pitch += this.pv*dt;
    for (const [off, k] of AXLES)
      if (Math.floor((p-off)/RAIL_LEN) !== Math.floor((this.lastPos-off)/RAIL_LEN)) {
        this.bv -= 1.4*k*(0.25+v);       // vertical jolt
        AUDIO.knock(k, v);
        this.pv -= 0.006*k*(0.25+v);     // and a nod of the whole body
      }
    this.lastPos = p;
    for (let n = Math.ceil(dt/0.02), h = dt/n; n > 0; n--) {   // stiff spring: substep for stability
      this.bv += (-CAM.dy*900 - this.bv*14) * h;
      CAM.dy += this.bv*h;
    }
    CAM.dx = v*(0.035*Math.sin(p*0.203) + 0.014*Math.sin(p*0.537 + 1.3));
    CAM.roll = curvatureAt(p)*28 + v*0.0035*Math.sin(p*0.151);
  },
};

// ============================================================
// ENVIRONMENT — time of day and weather, chosen with T / Y.
// Scene colours all pass through haze(), which applies ENV.grade (ambient
// light) and fades toward ENV.fog. Surfaces under station lighting use
// ENV.lamp instead (DL items flagged lamp). Light sources — signals, LEDs,
// lit windows — keep literal colours or use glow(), so they shine at night.
// ============================================================
const TIMES = {
  day:   { name:'昼',   start:10*3600+12*60, grade:[1,1,1],          fog:[156,178,200], lamp:[1,1,1],
           sunEl:0.62, sunAz:-2.2, sky:['#0d2440','#2f5c86','#7ea4c2','#c6d8e4'],
           cloudTop:[255,255,255], cloudBase:[172,184,200] },
  eve:   { name:'夕方', start:16*3600+48*60, grade:[1.0,0.80,0.66],  fog:[208,150,122], lamp:[0.95,0.9,0.84],
           sunEl:0.09, sunAz:-2.2, sky:['#232650','#5d4a78','#d9895e','#f4c48e'],
           cloudTop:[255,204,158], cloudBase:[120,94,118] },
  night: { name:'夜',   start:20*3600+12*60, grade:[0.24,0.27,0.38], fog:[28,34,52],    lamp:[0.84,0.84,0.80],
           sunEl:0.62, sunAz:-2.2, sky:['#02050b','#070d1a','#121a2c','#3a3238'],
           cloudTop:[50,50,60], cloudBase:[24,26,36] },
};
const WEATHERS = {
  clear: { name:'晴れ', dim:[1,1,1],          fogMix:0,    fogK:1,   clouds:18, overcast:0 },
  cloud: { name:'曇り', dim:[0.84,0.86,0.9],  fogMix:0.55, fogK:1.3, clouds:24, overcast:0.75 },
  rain:  { name:'雨',   dim:[0.62,0.66,0.72], fogMix:0.75, fogK:2.0, clouds:30, overcast:0.95 },
};
const ENV = {
  time: 'day', wx: 'clear',
  apply() {
    const T = this.T = TIMES[this.time], Wx = this.Wx = WEATHERS[this.wx];
    this.start = T.start;
    this.night = this.time === 'night';
    this.rain = this.wx === 'rain';
    this.sunOn = !this.night && this.wx === 'clear';   // otherwise light is diffuse: no shadows
    this.grade = T.grade.map((c,i) => c*Wx.dim[i]);
    const fg = T.fog.map(c => c*Wx.dim[1]), grey = (fg[0]+fg[1]+fg[2])/3;
    this.fog = fg.map(c => c + (grey-c)*Wx.fogMix);
    this.fogK = Wx.fogK;
    this.lamp = this.time === 'day' ? this.grade : T.lamp.map((c,i) => Math.max(c, this.grade[i]));
  },
  cycle(key) {
    const ks = Object.keys(key === 'time' ? TIMES : WEATHERS);
    this[key] = ks[(ks.indexOf(this[key]) + 1) % ks.length];
    this.apply();
  },
};
ENV.apply();
let LAMP = false;   // true while drawing a station interior: lit by its lamps, not the sky

// ============================================================
// SUNLIGHT — one afternoon sun, fixed in the world. The train's heading
// (curvature integrated round the loop) turns it relative to the cab, so
// faces brighten and shadows swing as the line bends.
// SUN is a unit vector TOWARD the sun in cab axes: x right, y up, z ahead.
// ============================================================
function buildHeading() {
  const step = 4, n = Math.ceil(TOTAL_LOOP/step)+1, h = new Float32Array(n);
  for (let i=1;i<n;i++) h[i] = h[i-1] + curvatureAt((i-1)*step)*step;
  // the loop closes exactly one turn: right for 外回り, left for 内回り
  const fix = (Math.sign(h[n-1])*2*Math.PI - h[n-1]) / (n-1);
  for (let i=1;i<n;i++) h[i] += fix*i;
  return h;
}
let HEADING = buildHeading();
const SUN = {
  x: 0, y: 0, z: 0, hd: 0,
  update() {
    const u = (loopPos(S.train.position)+TOTAL_LOOP)%TOTAL_LOOP/4, i = u|0, f = u-i;
    // 内回り sets off from 品川 facing the other way, so its heading starts at π
    const hd = HEADING[i]*(1-f) + HEADING[Math.min(i+1, HEADING.length-1)]*f + ROUTE.hd0;
    const el = ENV.T.sunEl, b = ENV.T.sunAz - hd, c = Math.cos(el);
    this.hd = hd;   // the sky (clouds, stars) turns with the heading too
    this.x = c*Math.sin(b); this.y = Math.sin(el); this.z = c*Math.cos(b);
  },
};
// Brightness factor by surface facing: 'f' toward the cab, 'l' facing left,
// 'r' facing right, 't' facing up.
function lit(n) {
  if (!ENV.sunOn) return 0.86;
  const d = n==='f' ? -SUN.z : n==='l' ? -SUN.x : n==='r' ? SUN.x : SUN.y;
  return 0.66 + 0.5*Math.max(0, d);
}

const GAUGE = 0.5335;  // half of 1.067 m narrow gauge
const FAR = 420;       // draw distance, metres
const JP = '"Hiragino Sans","Yu Gothic",sans-serif';

// Deterministic per-position noise so scenery never flickers.
function hash(n) {
  let h = Math.imul(n|0, 374761393) + 668265263 | 0;
  h = Math.imul(h ^ h>>>13, 1274126177);

function quad(a, b, c, d, fill) {

const Z_CLIP = 0.3;

function slab(x1, x2, y, z1, z2, fill) {
  if (z1 > z2) { const t = z1; z1 = z2; z2 = t; }
  if (z2 <= Z_CLIP) return;
  z1 = Math.max(z1, Z_CLIP);
  quad(CAM.project(x1,y,z1), CAM.project(x2,y,z1), CAM.project(x2,y,z2), CAM.project(x1,y,z2), fill);
}
// Vertical wall: at lateral x, from height y1..y2, from depth z1 to z2.
function wall(x, y1, y2, z1, z2, fill) {

  if (z2 <= Z_CLIP) return;
  z1 = Math.max(z1, Z_CLIP);
  quad(CAM.project(x,y1,z1), CAM.project(x,y2,z1), CAM.project(x,y2,z2), CAM.project(x,y1,z2), fill);
}
// Flat face square-on to the track: x1..x2 by y1..y2, all at depth z.
function face(x1, x2, y1, y2, z, fill) {
  if (z <= Z_CLIP) return;

}
function rrect(x, y, w, h, r) {

  X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r);
  X.arcTo(x,y+h,x,y,r);     X.arcTo(x,y,x+w,y,r);
  X.closePath();
}
function text(str, x, y, font, fill, align) {

  X.fillText(str, x, y); X.textAlign = 'start';
