// ============================================================
// SCENE: SKY & GROUND
// ============================================================
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mix = (c, d, t) => c.map((v,i) => v + (d[i]-v)*t);
// Clouds and stars sit at infinity: placed by bearing and elevation in the
// world, so they only turn with the train's heading, never approach.
const CLOUDS = Array.from({length: 30}, (_, i) => ({
  b: hash(i*7+1)*Math.PI*2, e: 0.03 + Math.pow(hash(i*7+2), 1.5)*0.2,
  w: 0.10 + hash(i*7+3)*0.24, n: 5 + (hash(i*7+4)*6|0), seed: i*97,
}));
function skyPoint(b, e) {
  let rel = b - SUN.hd;
  rel = ((rel + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
  if (Math.abs(rel) > 1.15) return null;
  return { x: CAM.cx + CAM.f*Math.tan(rel), y: CAM.horizonY - CAM.f*Math.tan(e) };
}
function drawClouds() {
  const T = ENV.T, Wx = ENV.Wx, drift = (S.worldTime||0)*0.0004;
  const og = Wx.overcast, d = ENV.grade;
  const top = mix(T.cloudTop, [196*d[0], 200*d[1], 206*d[2]], og*0.8);
  const base = mix(T.cloudBase, [112*d[0], 118*d[1], 128*d[2]], og*0.8);
  for (let i = 0; i < Wx.clouds; i++) {
    const c = CLOUDS[i], p = skyPoint(c.b + drift, c.e);
    if (!p) continue;
    const w = CAM.f*c.w*(0.35 + c.e*4)*(1 + og*1.6);   // low = far = small; overcast spreads
    for (let pass = 0; pass < 2; pass++) {             // shaded underside, then the lit tops
      X.fillStyle = rgba(pass ? top : base, (pass ? 0.85 : 0.8)*(1 - og*0.55));
      for (let j = 0; j < c.n; j++) {
        const r = w*(0.10 + hash(c.seed+j+90)*0.12);
        const px = p.x + (hash(c.seed+j)-0.5)*w;
        const py = p.y - hash(c.seed+j+50)*w*0.14 - (pass ? r*0.28 : 0);
        X.beginPath(); X.ellipse(px, py, r*(pass ? 0.86 : 1), r*(pass ? 0.6 : 0.62), 0, 0, Math.PI*2); X.fill();
      }
    }
  }
}
function drawSky() {
  const hz = CAM.horizonY, T = ENV.T, og = ENV.Wx.overcast;
  const g = X.createLinearGradient(0, LAY.winY, 0, hz);
  g.addColorStop(0, T.sky[0]); g.addColorStop(0.45, T.sky[1]);
  g.addColorStop(0.82, T.sky[2]); g.addColorStop(1, T.sky[3]);
  // filled well past the window: the view is rolled by CAM.roll
  X.fillStyle = g; X.fillRect(-W*0.2, -H*0.2, W*1.4, hz+H*0.2);
  if (ENV.night && og < 0.5) {                        // a few stars the city glow hasn't drowned
    X.fillStyle = 'rgba(220,226,240,0.7)';
    for (let i = 0; i < 90; i++) {
      const p = skyPoint(hash(i*3+11)*Math.PI*2, 0.12 + hash(i*3+12)*0.5);
      if (p) X.fillRect(p.x, p.y, hash(i)<0.2 ? 2 : 1, hash(i)<0.2 ? 2 : 1);
    }
  }
  if (ENV.time === 'eve' && ENV.sunOn && SUN.z > 0.05) {   // low sun and its halo
    const sx = CAM.cx + CAM.f*SUN.x/SUN.z, sy = hz - CAM.f*SUN.y/SUN.z, r = CAM.f*0.012;
    const sg = X.createRadialGradient(sx, sy, 0, sx, sy, r*14);
    sg.addColorStop(0, 'rgba(255,236,190,0.9)'); sg.addColorStop(0.08, 'rgba(255,190,120,0.45)');
    sg.addColorStop(1, 'rgba(255,150,90,0)');
    X.fillStyle = sg; X.fillRect(sx-r*14, sy-r*14, r*28, r*28);
    X.fillStyle = '#fff1d6'; X.beginPath(); X.arc(sx, sy, r, 0, Math.PI*2); X.fill();
  }
  if (og > 0) {                                       // an overcast deck over everything
    const d = ENV.grade, oc = X.createLinearGradient(0, LAY.winY, 0, hz);
    oc.addColorStop(0, rgba([118*d[0], 124*d[1], 134*d[2]], og));
    oc.addColorStop(1, rgba(ENV.fog, og));
    X.fillStyle = oc; X.fillRect(-W*0.2, -H*0.2, W*1.4, hz+H*0.2);
  }
  drawClouds();
  const g2 = X.createLinearGradient(0, hz, 0, LAY.winB);
  g2.addColorStop(0, haze(FAR*0.8, 128,136,120)); g2.addColorStop(0.12, haze(80, 77,85,68));
  g2.addColorStop(1, haze(4, 25,28,21));
  X.fillStyle = g2; X.fillRect(-W*0.2, hz, W*1.4, LAY.winB-hz+H*0.2);
}
// Aerial perspective at eye level: soften the line where the city meets the ground.
function drawHorizonHaze() {
  const hz = CAM.horizonY, f = CAM.f, F = ENV.fog, k = ENV.rain ? 0.7 : 0.45;
  const g = X.createLinearGradient(0, hz - f*0.07, 0, hz + f*0.012);
  g.addColorStop(0, rgba(F, 0)); g.addColorStop(0.8, rgba(F, k)); g.addColorStop(1, rgba(F, k*0.3));
  X.fillStyle = g; X.fillRect(-W*0.2, hz - f*0.07, W*1.4, f*0.082);
}

// ============================================================
// SCENE: TRACKSIDE CITY — real Yamanote lineside character.
// Each stretch of the loop reproduces the actual district passed:
//   den   building density 0..1        h     [min,max] building height (m)
//   pal   façade base RGB              glass office-tower look, denser lit windows
//   signs billboard probability        trees standalone-tree probability
//   forest solid green wall on that side (-1 left / +1 right)
//   barrier 防音壁 on the lineside walls instead of a wire fence
//   cut   walled cutting               brick red-brick arch viaduct (神田〜新橋)
const DISTRICTS = [
  { to:2900,  den:0.85, h:[22,75], pal:[30,36,52], glass:true, signs:0.06, trees:0.04 }, // 品川・大崎 オフィスタワー
  { to:5600,  den:0.75, h:[9,30],  pal:[52,44,40], signs:0.10, trees:0.10, cut:true },   // 五反田・目黒・恵比寿 掘割区間
  { to:8000,  den:0.95, h:[14,70], pal:[38,34,46], signs:0.32, trees:0.03 },             // 渋谷 繁華街
  { to:9965,  den:0.45, h:[6,16],  pal:[56,46,38], signs:0.08, trees:0.15, forest:-1 },  // 原宿・代々木 明治神宮の森
  { to:11900, den:0.9,  h:[18,105],pal:[32,34,50], glass:true, signs:0.35, trees:0.02 }, // 新宿 超高層ビル群
  { to:15400, den:0.8,  h:[8,28],  pal:[54,46,38], signs:0.18, trees:0.08, barrier:true },             // 高田馬場・目白 学生街
  { to:19000, den:0.7,  h:[5,15],  pal:[62,52,40], signs:0.06, trees:0.22, barrier:true },             // 大塚・巣鴨・駒込 下町住宅
  { to:21900, den:0.5,  h:[8,22],  pal:[38,38,42], signs:0.05, trees:0.18, cut:true, forest:1 }, // 田端・日暮里 崖線と谷中の緑
  { to:24100, den:0.6,  h:[7,20],  pal:[58,48,38], signs:0.12, trees:0.20, forest:1 },   // 鶯谷・上野 上野の山
  { to:26400, den:1.0,  h:[10,32], pal:[48,36,46], signs:0.45, trees:0.0 },              // 御徒町・秋葉原 電気街
  { to:29600, den:0.9,  h:[26,85], pal:[30,36,52], glass:true, signs:0.08, trees:0.03, brick:true }, // 神田・東京・有楽町 丸の内
  { to:34500, den:0.85, h:[18,70], pal:[32,38,50], glass:true, signs:0.10, trees:0.05 }, // 新橋・浜松町・田町 湾岸オフィス
];
function districtAt(p) {
  const lp = loopPos(p);
  for (const d of DISTRICTS) if (lp < d.to) return d;
  return DISTRICTS[DISTRICTS.length-1];
}

// Unmistakable landmarks, world-anchored at their real spot on the loop.
const LANDMARKS = [
  { pos:10258, x:60,  type:'docomo'   },  // NTTドコモ代々木ビル (新宿手前・東側)
  { pos:16132, x:75,  type:'sunshine' },  // サンシャイン60 (池袋→大塚の南側)
  { pos:30352, x:95,  type:'tower'    },  // 東京タワー (浜松町の西側)
];

// Landmarks tower well above the streetscape, as in reality — the tallest
// lineside buildings are ~105 m, so these must clear them decisively.
function drawTokyoTower(x, z) {
  const HT = 170;
  for (let i=0;i<8;i++) {
    const y1 = HT*i/8, y2 = HT*(i+1)/8;
    const w1 = 1.8 + 34*Math.pow(1-y1/HT, 1.6), w2 = 1.8 + 34*Math.pow(1-y2/HT, 1.6);
    const col = i%2 ? haze(z*0.3, 232,226,218) : haze(z*0.3, 208,78,42);
    quad(CAM.project(x-w1/2, y1, z), CAM.project(x+w1/2, y1, z),
         CAM.project(x+w2/2, y2, z), CAM.project(x-w2/2, y2, z), col);
  }
  const ow = 1.8 + 34*Math.pow(1-78/HT, 1.6) + 3.2;
  face(x-ow/2, x+ow/2, 74, 82, z, haze(z*0.3, 226,222,214));   // main observatory
  face(x-0.8, x+0.8, HT, HT+20, z, haze(z*0.3, 208,78,42));    // antenna
}
function drawDocomoTower(x, z) {
  face(x-13, x+13, 0, 75, z, haze(z*0.3, 92, 88, 98));
  face(x-10, x+10, 75, 100, z, haze(z*0.3, 100, 96, 106));
  face(x-6.5, x+6.5, 100, 120, z, haze(z*0.3, 108, 104, 114));
  face(x-1.8, x+1.8, 120, 140, z, haze(z*0.3, 122, 118, 128)); // spire
}
function drawSunshine(x, z) {
  face(x-16, x+16, 0, 100, z, haze(z*0.3, 58, 66, 84));
  for (let i=0;i<5;i++) face(x-13.4+i*6, x-12.2+i*6, 3, 96, z, haze(z*0.3, 80, 90, 106));
  face(x-16.5, x+16.5, 97, 100, z, haze(z*0.3, 96, 104, 118));
}
function drawLandmarks() {
  const lp = loopPos(S.train.position);
  for (const lm of LANDMARKS) {
    let z = lm.pos - lp;
    if (z < -TOTAL_LOOP/2) z += TOTAL_LOOP;
    if (z >  TOTAL_LOOP/2) z -= TOTAL_LOOP;
    if (z < CAM.NEAR + 4 || z > 1300) continue;
    if (lm.type==='tower') drawTokyoTower(lm.x, z);
    else if (lm.type==='docomo') drawDocomoTower(lm.x, z);
    else drawSunshine(lm.x, z);
  }
}

function drawTreeClump(x, z, seed, big) {
  if (z > 320) return;
  const h = big ? 8 + hash(seed)*5 : 4.5 + hash(seed)*2.5;
  const g = CAM.project(x, 0, z), m = CAM.project(x, h*0.45, z);
  X.fillStyle = haze(z, 52, 40, 30);
  X.fillRect(g.x - 0.14*g.s, m.y, Math.max(1, 0.28*g.s), g.y - m.y);
  for (let i=0;i<3;i++) {
    const c = CAM.project(x + (hash(seed+i*7)-0.5)*(big?5:2.4), h*(0.55 + hash(seed+i*13)*0.3), z);
    X.beginPath();
    X.arc(c.x, c.y, Math.max(1.5, (big?2.6:1.6)*(0.8+hash(seed+i*3)*0.5)*c.s), 0, Math.PI*2);
    X.fillStyle = haze(z, 30+hash(seed+i)*22, 54+hash(seed+i*5)*24, 30+hash(seed+i)*12);
    X.fill();
  }
}

const SIGN_COLS = [[235,84,64],[248,196,44],[72,196,236],[238,238,232],[126,224,120],[236,120,196]];
function drawSigns(k, bx, bw, bh, z, prof) {
  if (hash(k+773) < 0.5) {
    // rooftop billboard
    const c1 = SIGN_COLS[(hash(k+661)*SIGN_COLS.length)|0];
    const sw = bw*0.72, sh = 2.6 + hash(k+881)*2.8;
    const a = CAM.project(bx-sw/2, bh+0.8+sh, z), b = CAM.project(bx+sw/2, bh+0.8, z);
    X.fillStyle = haze(z, c1[0], c1[1], c1[2]);
    X.fillRect(a.x, a.y, b.x-a.x, b.y-a.y);
    X.strokeStyle = haze(z, 246,246,240); X.lineWidth = 1;
    X.strokeRect(a.x, a.y, b.x-a.x, b.y-a.y);
  } else {
    // stacked vertical façade signs (電気街・繁華街の縦看板)
    const n = prof.signs > 0.3 ? 3 : 1;
    for (let i=0;i<n;i++) {
      const c = SIGN_COLS[(hash(k+91*i+661)*SIGN_COLS.length)|0];
      const yT = bh*(0.88 - i*0.28), yB = yT - bh*0.22;
      if (yB < 2) break;
      const a = CAM.project(bx-bw/2+1.0, yT, z), b = CAM.project(bx-bw/2+3.6, yB, z);
      X.fillStyle = haze(z, c[0], c[1], c[2]);
      X.fillRect(a.x, a.y, b.x-a.x, b.y-a.y);
    }
  }
}

// Ordinary façades are real materials (tile, render, concrete, brick) tinted
// toward the district palette; glass-district towers get curtain walls.
const FACADES = [[184,176,160],[206,202,192],[146,142,136],[158,124,100],[126,130,138],[190,182,168]];
const GLASS = [50, 64, 82];
function drawBuilding(k, bx, bw, bh, z, side, prof) {
  const r1 = hash(k), pal = prof.pal;
  const glassy = prof.glass && hash(k+9001) > 0.35;
  const resi = !prof.glass && prof.h[1] <= 22 && hash(k+57) < 0.7;   // マンション: balconies
  const shops = prof.signs > 0.15;
  const mat = FACADES[(hash(k+41)*FACADES.length)|0];
  const col = glassy ? [pal[0]*1.5+r1*20, pal[1]*1.6+r1*16, pal[2]*1.7+r1*20]
                     : mat.map((c,i) => c*0.62 + pal[i]*0.55 + (r1-0.5)*18);
  const FL = resi ? 2.9 : 3.6;                     // storey height
  const bd = 8 + hash(k+313)*14, kf = lit('f'), ks = lit(side>0 ? 'l' : 'r');
  const xn = bx - side*bw/2;                       // the corner nearest the track
  const tint = (z, c, f) => haze(z, c[0]*f, c[1]*f, c[2]*f);
  // rooftop machine room / water tank, set back behind the parapet
  if (bh > 10 && hash(k+77) < 0.75) {
    const pw = bw*(0.22 + hash(k+78)*0.2), px = bx + (hash(k+79)-0.5)*bw*0.4, zr = z + bd*0.45;
    face(px-pw/2, px+pw/2, bh, bh + 2.6 + hash(k+80)*2.2, zr, tint(zr, col, kf*0.92));
    if (bh > 40 && hash(k+81) < 0.5) face(px-0.12, px+0.12, bh, bh + 9, zr, haze(zr, 70, 72, 76));   // antenna mast
  }
  // the flank facing the track, drawn first so the front face overlaps it
  wall(xn, 0, bh, z, z+bd, tint(z+bd/2, glassy ? GLASS : col, ks));
  const fs = CAM.project(xn, 0, z+bd/2).s;
  if (z < 170 && FL*fs > 4)
    for (let y = FL; y < bh-1.2; y += FL)
      if (glassy) wall(xn, y-0.18, y+0.18, z, z+bd, tint(z+bd/2, col, ks));          // floor slabs
      else wall(xn, y+0.9, y+2.3, z+0.7, z+bd-0.7, tint(z+bd/2, GLASS, 0.75+0.25*ks)); // windows
  // front face — square to the track, so it is a plain screen rect
  const p1 = CAM.project(bx - bw/2, bh, z), p2 = CAM.project(bx + bw/2, 0, z);
  const w = p2.x-p1.x, h = p2.y-p1.y, s = p2.s;
  if (h < 1 || w < 1) return;
  const sy = y => p2.y - y*s;                      // height (m) -> screen y on this face
  X.fillStyle = tint(z, col, kf); X.fillRect(p1.x, p1.y, w, h);
  if (FL*s >= 3) {
    const gl = tint(z, GLASS, 0.8 + 0.2*kf);
    if (glassy) {
      const g = X.createLinearGradient(0, p1.y, 0, p2.y);   // sky reflected high, street dark low
      g.addColorStop(0, haze(z, 118, 146, 176)); g.addColorStop(1, haze(z, 44, 58, 76));
      X.fillStyle = g; X.fillRect(p1.x + 0.3*s, p1.y + 0.6*s, w - 0.6*s, h - 0.6*s);
      X.fillStyle = tint(z, col, kf);
      for (let y = FL; y < bh; y += FL) X.fillRect(p1.x, sy(y) - 0.2*s, w, Math.max(1, 0.4*s));
      if (1.5*s >= 4) for (let x = 1.5; x < bw; x += 1.5) X.fillRect(p1.x + x*s, p1.y, Math.max(1, 0.1*s), h);
    } else {
      for (let y = FL; y < bh - 1.2; y += FL) {
        X.fillStyle = gl;                              // window band of this storey
        X.fillRect(p1.x + 0.6*s, sy(y + 2.4), w - 1.2*s, 1.5*s);
        if (resi) {                                    // balcony parapet in front of it
          X.fillStyle = haze(z, 214*kf, 212*kf, 204*kf);
          X.fillRect(p1.x + 0.3*s, sy(y + 1.05), w - 0.6*s, 1.05*s);
        }
      }
      if (!resi && 1.8*s >= 5) {                       // mullions between the panes
        X.fillStyle = tint(z, col, kf);
        for (let x = 1.8; x < bw - 0.6; x += 1.8) X.fillRect(p1.x + x*s, p1.y, Math.max(1, 0.14*s), h - 3.6*s);
      }
    }
    if (ENV.time !== 'day') {      // lights on behind some of the panes
      const on = ENV.night ? 0.42 : 0.16, cw = glassy ? 1.5 : 1.8;
      for (let y = FL, row = 0; y < bh - 1.2; y += FL, row++)
        for (let x = 0.5, c = 0; x < bw - 1.0; x += cw, c++) {
          const r = hash(k*131 + row*17 + c*7);
          if (r > on) continue;
          X.fillStyle = glow(z, 255, 226 - r*90, 170 - r*160);
          X.fillRect(p1.x + x*s, sy(y + (glassy ? 2.9 : 2.35)), (cw - 0.4)*s, (glassy ? 2.2 : 1.4)*s);
        }
    }
    // street level: shopfronts with an awning, or a dark lobby
    X.fillStyle = ENV.night && shops ? glow(z, 150, 128, 96) : haze(z, 34, 38, 44);
    X.fillRect(p1.x + 0.5*s, sy(2.9), w - 1.0*s, 2.9*s);
    if (shops && !glassy) {
      const c = SIGN_COLS[(hash(k+19)*SIGN_COLS.length)|0];
      X.fillStyle = haze(z, c[0]*kf, c[1]*kf, c[2]*kf);
      X.fillRect(p1.x + 0.3*s, sy(3.4), w - 0.6*s, 0.5*s);
    }
  }
  X.fillStyle = tint(z, col, kf*1.12);                 // parapet coping catches the light
  X.fillRect(p1.x, p1.y, w, Math.max(1, 0.45*s));
  if (z < 240 && w > 12 && hash(k+551) < prof.signs) {
    LAMP = ENV.time !== 'day';                         // billboards are lit after dark
    drawSigns(k, bx, bw, bh, z, prof);
    LAMP = false;
  }
}

// 電柱 along the side roads: concrete poles every POLE_SP m with power and
// telecom lines strung between them, standing just outside the lineside walls.
const POLE_SP = 30, POLE_H = 11.5;
function drawPole(x, z, k, prof) {
  const kf = lit('f'), base = CAM.project(x, 0, z);
  if (base.s < 0.6) return;
  const col = haze(z, 158*kf, 156*kf, 150*kf), dark = haze(z, 60, 62, 66);
  quad(CAM.project(x-0.2, 0, z), CAM.project(x+0.2, 0, z),
       CAM.project(x+0.1, POLE_H, z), CAM.project(x-0.1, POLE_H, z), col);
  face(x-1.1, x+1.1, POLE_H-0.75, POLE_H-0.62, z, dark);          // crossarms
  face(x-0.8, x+0.8, POLE_H-1.9, POLE_H-1.78, z, dark);
  if (hash(k) < 0.35) face(x-0.32, x+0.32, POLE_H-3.6, POLE_H-2.5, z, haze(z, 120, 124, 128));   // transformer
  // lines on to the next pole further along
  const z2 = z + POLE_SP, wc = haze(z+15, 34, 36, 40);
  for (const dx of [-1.0, 0, 1.0]) wire(x+dx, x+dx, POLE_H-0.62, 0.45, z, z2, 0.02, wc);
  for (const dx of [-0.7, 0.7]) wire(x+dx, x+dx, POLE_H-1.78, 0.5, z, z2, 0.02, wc);
  wire(x, x, 6.2, 0.7, z, z2, 0.05, haze(z+15, 22, 22, 24));      // telecom cable, thick and low
}

// 跨線橋 — road bridges over the line, world-anchored between stations
const BRIDGES = [1000, 4850, 7800, 11250, 13727, 17750, 19841, 21586, 23540, 25189, 31639];
const BR_Y = 8.3, BR_D = 11;   // soffit height above rail, deck width along the track
function drawBridge(z) {
  if (z + BR_D < CAM.NEAR) return;
  const kf = lit('f'), z1 = Math.max(z, 1.0), z2 = z + BR_D;
  for (const [x1, x2] of [[-16.5, -13.6], [13.6, 16.5]]) {        // abutments beyond the walls
    const xn = x1 < 0 ? x2 : x1;
    wall(xn, 0, BR_Y, Math.max(z1, z+1), z2-1, haze(z, 120, 118, 112));
    if (z+1 > CAM.NEAR) face(x1, x2, 0, BR_Y, z+1, haze(z, 150*kf, 148*kf, 140*kf));
  }
  slab(-60, 60, BR_Y, z1, z2, haze(z, 62, 64, 66));                // soffit, always in shade
  if (z < CAM.NEAR) return;
  face(-60, 60, BR_Y, BR_Y+1.4, z, haze(z, 164*kf, 162*kf, 156*kf));          // edge girder
  face(-60, 60, BR_Y+0.05, BR_Y+0.22, z-0.02, haze(z, 128, 126, 120));         // drip line
  face(-60, 60, BR_Y+1.4, BR_Y+2.3, z+0.15, haze(z, 186*kf, 184*kf, 178*kf));  // parapet
  X.globalAlpha = 0.28;                                                         // 投物防止柵
  face(-60, 60, BR_Y+2.3, BR_Y+4.2, z+0.25, haze(z, 70, 76, 80));
  X.globalAlpha = 1;
  const p = CAM.project(0, 0, z);
  if (2.5*p.s > 4) for (let x = -60; x <= 60; x += 2.5)
    face(x-0.05, x+0.05, BR_Y+2.3, BR_Y+4.2, z+0.25, haze(z, 70, 74, 78));
  face(-60, 60, BR_Y+4.1, BR_Y+4.2, z+0.25, haze(z, 70, 74, 78));
}

function drawCity() {
  const scroll = S.train.position;
  drawLandmarks();   // farthest first — city rows draw over them where they overlap
  const SP = 26;
  const start = Math.floor((scroll+FAR)/SP)*SP;
  for (let d = start; d > scroll - SP; d -= SP) {   // far -> near
    const z = d - scroll;
    const prof = districtAt(d);
    for (let side = -1; side <= 1; side += 2) {
      const dl = loopPos(d);
      if (side === YARD_SIDE && dl > YARD[0] && dl < YARD[1]) continue;  // open sky over the rail yard
      if (z <= 22) continue;                         // too close to see past the walls
      const k = (d/SP|0)*2 + (side>0?1:0);
      const r1 = hash(k), r2 = hash(k+9001), r3 = hash(k+7717);
      if (prof.forest === side) {                    // 明治神宮・上野の山・谷中の緑の壁
        drawTreeClump(side*(15 + r1*7), z, k*13, true);
        drawTreeClump(side*(22 + r2*9), z, k*29, true);
        continue;
      }
      if (hash(k+31) < prof.trees) { drawTreeClump(side*(16 + r1*9), z, k*17, false); continue; }
      if (r3 < 1 - prof.den) continue;               // gaps in the streetscape
      const bh = prof.h[0] + r2*(prof.h[1]-prof.h[0]);
      const bw = 10 + r3*22;
      const bx = side*(25 + r1*50);
      drawBuilding(k, bx, bw, bh, z, side, prof);
    }
    // poles and bridges in this slice, in front of its buildings
    for (let pd = Math.floor(d/POLE_SP)*POLE_SP; pd > d - SP; pd -= POLE_SP) {
      const pz = pd - scroll, pp = districtAt(pd), pl = loopPos(pd);
      if (pz < CAM.NEAR || pz > 330 || pp.brick) continue;
      for (let side = -1; side <= 1; side += 2) {
        if (pp.forest === side || (side === YARD_SIDE && pl > YARD[0] && pl < YARD[1])) continue;
        drawPole(side*15.6, pz, pd/POLE_SP*2 + side, pp);
      }
    }
    for (const bp of BRIDGES) {
      let bz = bp - loopPos(d) + z;                  // the loop wraps: compare by loop position
      if (bz > TOTAL_LOOP/2) bz -= TOTAL_LOOP;
      if (bz <= z && bz > z - SP) drawBridge(bz);
    }
  }
}

// ============================================================
// SCENE: TRACK  (shared ballast, two tracks — Yamanote is double)
// ============================================================
const ZSEG = [7, 10, 14, 19, 27, 40, 60, 92, 130, 175, 230, 290, 350, FAR];
// Japan runs on the left: the opposite-direction track lies to our RIGHT, and
// our platforms, signals and lineside signs stand on the LEFT.
const OPP_X = 3.8;

function drawBallast() {
  const scroll = S.train.position;
  const kt = lit('t');
  for (let i=ZSEG.length-2;i>=0;i--) {   // far -> near: troughs and walls stand above the ballast
    const zm = (ZSEG[i]+ZSEG[i+1])/2;
    const prof = districtAt(scroll + zm);
    slab(-3.6, 7.2, -0.30, ZSEG[i], ZSEG[i+1], haze(zm, 100*kt, 97*kt, 92*kt));   // crushed-stone ballast
    for (const ox of [0, OPP_X])                                                     // rust-stained bed under each track
      slab(ox-1.05, ox+1.05, -0.29, ZSEG[i], ZSEG[i+1], haze(zm, 98*kt, 84*kt, 72*kt));
    slab(6.4, 7.2, -0.05, ZSEG[i], ZSEG[i+1], haze(zm, 58, 60, 52));    // cess edge
    // concrete cable troughs (トラフ) along both sides
    for (const tx of [-2.45, 6.35]) {
      wall(tx, -0.30, 0.06, ZSEG[i], ZSEG[i+1], haze(zm, 104, 102, 96));
      slab(tx-0.42, tx, 0.06, ZSEG[i], ZSEG[i+1], haze(zm, 150*kt, 148*kt, 140*kt));
    }
    // lineside wall — retaining wall, cutting wall, or 赤レンガ高架橋 by district
    for (let side=-1; side<=1; side+=2) {
      const wl = loopPos(scroll + zm);
      if (side === YARD_SIDE && wl > YARD[0] && wl < YARD[1]) continue;   // yard is open, no wall
      const kw = lit(side < 0 ? 'r' : 'l'), wh = prof.brick ? 3.6 : prof.cut ? 4.4 : 2.05;
      if (side*SUN.x > 0) {                  // sun behind this wall: it shades the ground toward the track
        const sw = Math.min(9, (wh+0.3)*Math.abs(SUN.x)/SUN.y);
        shadow(side*13.0, side*(13.0-sw), -0.29, ZSEG[i], ZSEG[i+1], 0.30);
      }
      if (prof.brick) {
        wall(side*13.0, -0.3, 3.6, ZSEG[i], ZSEG[i+1], haze(zm, 118*kw, 62*kw, 44*kw));
        slab(side*12.8, side*13.2, 3.6, ZSEG[i], ZSEG[i+1], haze(zm, 172, 152, 132));
        // arch openings every 11 m (ガード下)
        if (zm < 210) for (let d = Math.ceil((scroll+ZSEG[i]+1.9)/11)*11; d-scroll+1.9 < ZSEG[i+1]; d += 11) {
          const az = d - scroll;
          if (az - 1.9 < ZSEG[i]) continue;
          wall(side*12.95, 0, 1.9, az-1.9, az+1.9, haze(az, 42, 28, 24));
          const a = CAM.project(side*12.95, 1.9, az-1.9), b = CAM.project(side*12.95, 1.9, az+1.9);
          X.beginPath();
          X.ellipse((a.x+b.x)/2, (a.y+b.y)/2, Math.abs(b.x-a.x)/2, 1.15*(a.s+b.s)/2, 0, Math.PI, 0);
          X.fillStyle = haze(az, 42, 28, 24); X.fill();
        }
      } else {
        // shrubs along the far side of the wall, in leafier districts
        if (prof.trees >= 0.08 && prof.forest !== side)
          for (let d = Math.floor((scroll+ZSEG[i])/15)*15; d < scroll+ZSEG[i+1]; d += 15) {
            const hr = hash(d*7 + side);
            if (hr > prof.trees*3) continue;
            const za = Math.max(ZSEG[i], d-scroll), zb = Math.min(ZSEG[i+1], d+15-scroll), hh = wh + 0.7 + hr*1.6;
            wall(side*13.7, wh, hh, za, zb, haze(zm, 46*kw, 70*kw, 42*kw));
            if (zm < 120) for (let t = 0; t < 3; t++) {
              const zc = d - scroll + 2.5 + t*5;
              if (zc < za || zc > zb) continue;
              const c = CAM.project(side*13.7, hh, zc);
              X.fillStyle = haze(zc, (52+t*6)*kw, (80+t*5)*kw, 46*kw);
              X.beginPath(); X.ellipse(c.x, c.y, 1.9*c.s, 0.6*c.s, 0, 0, Math.PI*2); X.fill();
            }
          }
        // cuttings wall the line in (目黒・田端あたり) — wh is 4.4 there
        wall(side*13.0, -0.3, wh, ZSEG[i], ZSEG[i+1], haze(zm, 86*kw, 84*kw, 80*kw));
        slab(side*12.8, side*13.2, wh, ZSEG[i], ZSEG[i+1], haze(zm, 96, 94, 90));
        // on top: 防音壁 in residential stretches, otherwise a chain-link fence
        const near = zm < 200, step = prof.barrier ? 2 : 2.5;
        if (prof.barrier) {
          wall(side*13.0, wh, wh+1.25, ZSEG[i], ZSEG[i+1], haze(zm, 176*kw, 174*kw, 166*kw));
          X.globalAlpha = 0.35;
          wall(side*13.0, wh+1.25, wh+2.05, ZSEG[i], ZSEG[i+1], haze(zm, 120, 150, 170));
          X.globalAlpha = 1;
        } else {
          X.globalAlpha = 0.22;
          wall(side*13.0, wh, wh+1.6, ZSEG[i], ZSEG[i+1], haze(zm, 60, 66, 70));
          X.globalAlpha = 1;
          wall(side*13.0, wh+1.55, wh+1.62, ZSEG[i], ZSEG[i+1], haze(zm, 90, 96, 100));
        }
        if (near) for (let d = Math.ceil((scroll+ZSEG[i])/step)*step; d < scroll+ZSEG[i+1]; d += step) {
          const zp = d - scroll;
          wall(side*12.98, wh, wh + (prof.barrier ? 2.05 : 1.62), zp-0.05, zp+0.05,
               prof.barrier ? haze(zp, 96, 100, 104) : haze(zp, 82, 88, 92));
        }
      }
    }
  }
}

// At speed the eye smears the ballast into streaks along the line of travel.
// World-anchored stones on a random (not periodic) grid, so they never strobe;
// each is stretched with speed and fades in above ~35 km/h.
function drawSpeedStreaks() {
  const v = S.train.speed/3.6, a = Math.min(1, Math.max(0, (S.train.speed - 35)/45));
  if (a <= 0) return;
  const scroll = S.train.position, len = 0.2 + v*0.12, kt = lit('t');
  const lanes = [6.6, 5.9, 4.95, 2.85, 1.9, 1.15, -1.15, -1.9, -2.25];   // clear of the rail heads
  for (let d = Math.floor((scroll+60)/1.5)*1.5; d - scroll > CAM.NEAR - len; d -= 1.5) {   // far -> near
    const n = Math.round(d/1.5);
    for (let i = 0; i < lanes.length; i++) {
      const h = hash(n*31 + i*7);
      if (h > 0.45) continue;
      const z = d - scroll + hash(n*13 + i)*1.5, x = lanes[i] + (hash(n*5 + i*3) - 0.5)*0.5;
      const z1 = Math.max(CAM.NEAR, z), z2 = z + len;
      if (z2 <= z1) continue;
      const c = h < 0.2 ? 160 : 62, w = 0.03 + h*0.08;
      X.globalAlpha = a*(0.5 - z/150);
      slab(x - w, x + w, -0.25, z1, z2, haze(z, c*kt, (c-4)*kt, (c-10)*kt));
    }
  }
  X.globalAlpha = 1;
}

// bridge shadows land on the ballast; drawn after it, before the rails
function drawBridgeShadows() {
  if (!ENV.sunOn) return;
  const lp = loopPos(S.train.position), dz = -(BR_Y+1.4)*SUN.z/SUN.y;
  for (const bp of BRIDGES) {
    let z = bp - lp;
    if (z < -TOTAL_LOOP/2) z += TOTAL_LOOP;
    const z1 = Math.max(CAM.NEAR, z + dz), z2 = z + BR_D + dz;
    if (z2 > z1 && z1 < FAR) shadow(-13, 13, -0.27, z1, z2, 0.38);
  }
}

function drawRails(ox, limit, dim) {
  const scroll = S.train.position;
  const SP = 0.62, kt = lit('t'), kd = dim ? 0.85 : 1;
  // Motion blur: smear each sleeper over the distance travelled this frame.
  // Without it a 0.62 m pattern strobes (wagon-wheel effect): past ~67 km/h at
  // 60 fps the sleepers seem to slow down or even roll backwards.
  const bl = Math.min(SP*1.5, S.train.speed/3.6*FRAME_DT), sa = 0.24/(0.24 + bl);
  // PC (concrete) sleepers, with stone texture in the cribs and fasteners up close
  for (let d = Math.floor((scroll+limit)/SP)*SP; d - scroll > CAM.NEAR; d -= SP) {   // far -> near
    const z = d - scroll, n = Math.round(d/SP), v = hash(n*3 + (dim?1:0))*14;
    X.globalAlpha = sa;
    slab(ox-1.0, ox+1.0, -0.02, z-0.12-bl/2, z+0.12+bl/2, haze(z, (128+v)*kt*kd, (126+v)*kt*kd, (120+v)*kt*kd));
    X.globalAlpha = 1;
    if (z < 40 && bl < 0.1) {
      face(ox-1.0, ox+1.0, -0.12, -0.02, z-0.12, haze(z, 92*kd, 90*kd, 86*kd));   // front edge, in shade
      for (const rx of [ox-GAUGE, ox+GAUGE])                                      // clips either side of the rail
        for (const cx of [rx-0.09, rx+0.09])
          slab(cx-0.045, cx+0.045, 0.0, z-0.05, z+0.05, haze(z, 38, 40, 42));
    }
    if (z < 30 && bl < 0.25) for (let j=0;j<6;j++) {                              // ballast stones in the crib
      const h = hash(n*61 + j*7 + (dim?3:0));
      const sx = ox + (h-0.5)*2.4, sz = z + 0.17 + hash(n*17 + j)*0.28;
      const c = h > 0.5 ? 126 : 70;
      slab(sx-0.05, sx+0.05, -0.24, sz-0.03, sz+0.03, haze(sz, c*kt, (c-4)*kt, (c-10)*kt));
    }
  }
  // rails: rust-brown web and foot, a polished running band on the head
  const shine = 196 + 52*Math.max(0, SUN.z);   // the band glints when running toward the sun
  for (let side=-1; side<=1; side+=2) {
    const rx = ox + side*GAUGE;
    for (let i=0;i<ZSEG.length-1;i++) {
      if (ZSEG[i] > limit) break;
      const a = ZSEG[i], b = Math.min(ZSEG[i+1], limit), zm = (a+b)/2;
      slab(rx-0.07, rx+0.07, -0.015, a, b, haze(zm, 84*kd, 62*kd, 48*kd));          // foot
      quad(CAM.project(rx-0.036,0.00,a), CAM.project(rx+0.036,0.00,a),
           CAM.project(rx+0.036,0.00,b), CAM.project(rx-0.036,0.00,b),
           haze(zm, 112*kd, 92*kd, 78*kd));                                          // web
      quad(CAM.project(rx-0.016,0.03,a), CAM.project(rx+0.016,0.03,a),
           CAM.project(rx+0.016,0.03,b), CAM.project(rx-0.016,0.03,b),
           haze(zm, shine*kd, (shine+3)*kd, (shine+8)*kd));                          // head
    }
    // rail joints — fishplates and the gap, at the same spots CABMOTION knocks
    for (let d = Math.ceil((scroll+CAM.NEAR)/RAIL_LEN)*RAIL_LEN; d - scroll < Math.min(limit, 110); d += RAIL_LEN) {
      const z = d - scroll;
      wall(rx - side*0.04, -0.01, 0.022, z-0.4, z+0.4, haze(z, 48, 44, 40));
      slab(rx-0.017, rx+0.017, 0.031, z-0.012, z+0.012, haze(z, 30, 30, 32));
    }
  }
}

// ============================================================
// SCENE: CATENARY
// 門型ビーム every SPAN m: two masts and a lattice beam across both tracks.
// Each track hangs a simple catenary from drop brackets — the messenger sags
// between supports, droppers hold the contact wire level, and the contact
// wire zig-zags ±STAGGER so it wears the pantograph evenly. Feeders run
// along the mast tops.
// ============================================================
const SPAN = 50, MAST_H = 7.9, BEAM_Y = 7.15, MESS_Y = 6.15, CONT_Y = 5.1;
const SAG = 0.42, STAGGER = 0.2, MASTS = [-3.4, 7.0], TRACKS = [0, OPP_X];
const BEAM_L = MASTS[0], BEAM_R = MASTS[1];

// a screen-space line between two world points, width in metres
function wline(x1, y1, z1, x2, y2, z2, wm, col) {
  const a = CAM.project(x1, y1, z1), b = CAM.project(x2, y2, z2);
  X.strokeStyle = col; X.lineWidth = Math.max(0.7, wm*(a.s+b.s)/2);
  X.beginPath(); X.moveTo(a.x, a.y); X.lineTo(b.x, b.y); X.stroke();
}
// a wire hanging between two supports: lateral x1->x2, height y at each end, sagging by sag
function wire(x1, x2, y, sag, z1, z2, wm, col) {
  if (z2 < 2.5 || z1 > FAR) return;
  const n = z1 < 60 ? 10 : 4;
  X.strokeStyle = col; X.beginPath();
  let first = true, sMax = 0;
  for (let i=0;i<=n;i++) {
    const t = i/n, z = z1 + (z2-z1)*t;
    if (z < 2.5) continue;
    const p = CAM.project(x1 + (x2-x1)*t, y - sag*4*t*(1-t), z);
    first ? X.moveTo(p.x, p.y) : X.lineTo(p.x, p.y); first = false;
    sMax = Math.max(sMax, p.s);
  }
  X.lineWidth = Math.max(0.7, Math.min(wm*sMax, 3)); X.stroke();
}

function drawCatenary() {
  const scroll = S.train.position;
  // mast and beam shadows across the track, cast from the world-fixed sun
  const sx = -SUN.x/SUN.y, sz = -SUN.z/SUN.y;   // ground offset per metre of height
  if (ENV.sunOn) for (let d = Math.floor((scroll+160)/SPAN)*SPAN; d > scroll; d -= SPAN) {
    const z = d - scroll, zt = z + MAST_H*sz, zb = z + BEAM_Y*sz;
    if (Math.min(z, zt, zb) < CAM.NEAR - 3) continue;
    const sh = '#0b0d12', w = 0.17;
    X.globalAlpha = 0.28;
    for (const px of MASTS)
      quad(CAM.project(px-w,-0.02,z), CAM.project(px+w,-0.02,z),
           CAM.project(px+MAST_H*sx+w,-0.02,zt), CAM.project(px+MAST_H*sx-w,-0.02,zt), sh);
    quad(CAM.project(BEAM_L+BEAM_Y*sx,-0.02,zb-0.25), CAM.project(BEAM_R+BEAM_Y*sx,-0.02,zb-0.25),
         CAM.project(BEAM_R+BEAM_Y*sx,-0.02,zb+0.25), CAM.project(BEAM_L+BEAM_Y*sx,-0.02,zb+0.25), sh);
    X.globalAlpha = 1;
  }
  const kf = lit('f'), first = Math.floor((scroll+FAR)/SPAN)*SPAN;
  // each span is a display-list item keyed at its portal, so trains sort against it
  for (let d = first; d > scroll - SPAN; d -= SPAN) {       // far -> near
    const z = d - scroll, z2 = z + SPAN, i = Math.round(d/SPAN);
    DL.push({z: z, pr: 0, f: () => {
    X.lineCap = 'round';
    const st1 = (i%2 ? 1 : -1)*STAGGER, st2 = -st1;
    // the span beyond this support: feeders, then each track's catenary
    for (const fx of [-3.75, 7.35]) wire(fx, fx, MAST_H+0.35, 0.9, z, z2, 0.035, haze(z+SPAN/2, 46, 48, 52));
    wire(-3.75, -3.75, MAST_H-0.6, 0.7, z, z2, 0.018, haze(z+SPAN/2, 62, 64, 68));     // 配電線
    for (const ox of TRACKS) {
      wire(ox+st1, ox+st2, MESS_Y, SAG, z, z2, 0.016, haze(z+SPAN/2, 70, 72, 76));   // messenger
      wire(ox+st1, ox+st2, CONT_Y, 0, z, z2, 0.02, haze(z+SPAN/2, 92, 78, 58));      // contact (copper)
      if (z < 140) for (let t = 0.1; t < 0.95; t += 0.1) {                           // droppers
        const zd = z + SPAN*t;
        if (zd < 3) continue;
        const xd = ox + st1 + (st2-st1)*t;
        wline(xd, CONT_Y, zd, xd, MESS_Y - SAG*4*t*(1-t), zd, 0.008, haze(zd, 84, 86, 90));
      }
    }
    if (z < CAM.NEAR) { X.lineCap = 'butt'; return; }
    // the portal itself
    const mc = haze(z, 104*kf, 108*kf, 112*kf), ms = haze(z, 70, 74, 78);
    // at a platform our-side mast rises through the canopy: seen from below,
    // the canopy hides it from the roof up to where the sightline clears the fascia
    const plat = STATIONS.some(st => { let g = loopPos(d) - st.pos;
      if (g < -TOTAL_LOOP/2) g += TOTAL_LOOP; if (g > TOTAL_LOOP/2) g -= TOTAL_LOOP;
      return g > -PLAT_LEN && g < 26; });
    for (const mx of MASTS) {
      const parts = plat && mx === BEAM_L ? [[0, 4.55], [5.8, MAST_H]] : [[0, MAST_H]];
      for (const [y1, y2] of parts) {
        wall(mx - Math.sign(mx)*0.17, y1, y2, z-0.17, z+0.17, ms);   // side toward the track
        face(mx-0.17, mx+0.17, y1, y2, z-0.17, mc);
      }
    }
    face(BEAM_L, BEAM_R, MAST_H-0.22, MAST_H, z-0.2, mc);              // top chord
    face(BEAM_L, BEAM_R, BEAM_Y, BEAM_Y+0.16, z-0.2, mc);               // bottom chord
    if (CAM.project(0, 0, z).s > 6) {                                     // lattice web
      X.strokeStyle = mc; X.lineWidth = Math.max(0.8, 0.05*CAM.project(0,0,z).s);
      X.beginPath();
      for (let x = BEAM_L, up = 0; x <= BEAM_R; x += 0.75, up ^= 1) {
        const p = CAM.project(x, up ? MAST_H-0.22 : BEAM_Y+0.16, z-0.2);
        x === BEAM_L ? X.moveTo(p.x, p.y) : X.lineTo(p.x, p.y);
      }
      X.stroke();
    }
    // drop brackets: pipe from the beam, insulators, a stay to the messenger
    // and a registration arm out to the (staggered) contact wire
    for (const ox of TRACKS) {
      const px = ox + (ox === 0 ? -1.15 : 1.15), cx = ox + st1;   // bracket hangs toward its mast
      const pc = haze(z, 86, 90, 94);
      wline(px, BEAM_Y, z, px, CONT_Y-0.15, z, 0.06, pc);
      wline(px, MESS_Y+0.05, z, cx, MESS_Y, z, 0.045, pc);
      wline(px, CONT_Y+0.25, z, cx, CONT_Y, z, 0.035, pc);
      for (const [y, x2] of [[MESS_Y+0.05, cx], [CONT_Y+0.25, cx]]) {   // brown porcelain insulators
        const xi = px + (x2-px)*0.25;
        wline(px + (x2-px)*0.08, y, z, xi, y, z, 0.11, haze(z, 132, 74, 48));
      }
    }
    X.lineCap = 'butt';
    }});
  }
}

// ============================================================
// SCENE: LINESIDE SIGNS & SIGNALS  (anchored to the world, not the train)
// ============================================================
function drawSpeedSign(z, lim) {
  const base = CAM.project(-2.55, 0, z), top = CAM.project(-2.55, 2.15, z);
  const s = base.s;
  X.fillStyle = haze(z, 92, 94, 98);
  X.fillRect(base.x - 0.05*s, top.y, Math.max(1, 0.10*s), base.y-top.y);
  const c = CAM.project(-2.55, 2.6, z), r = Math.max(2, 0.44*s);
  X.beginPath(); X.arc(c.x, c.y, r, 0, Math.PI*2);
  X.fillStyle = haze(z, 236,236,230); X.fill();
  X.lineWidth = Math.max(1, r*0.17); X.strokeStyle = haze(z, 186,44,44); X.stroke();
  if (r > 7) {
    X.textBaseline = 'middle';
    text(lim, c.x, c.y, `bold ${Math.floor(r*1.05)}px monospace`, '#1a1a1a', 'center');
    X.textBaseline = 'alphabetic';
  }
}

function drawSignal(z, aspect) {
  const base = CAM.project(-3.05, 0, z), s = base.s;
  const mastTop = CAM.project(-3.05, 4.6, z);
  X.fillStyle = haze(z, 70, 72, 76);
  X.fillRect(base.x - 0.06*s, mastTop.y, Math.max(1, 0.12*s), base.y-mastTop.y);
  const head = CAM.project(-3.05, 5.35, z);
  const hw = Math.max(3, 0.62*s), hh = Math.max(5, 1.55*s);
  X.fillStyle = haze(z, 34, 36, 38);
  rrect(head.x-hw/2, head.y-hh/2, hw, hh, Math.min(4, hw*0.3)); X.fill();
  const lampR = Math.max(1.2, hw*0.28);
  const slots = ['#3a1010','#3a3410','#103a18'];
  const onIdx = aspect==='#ff3b30' ? 0 : aspect==='#ffcc00' ? 1 : 2;
  for (let i=0;i<3;i++) {
    const ly = head.y - hh*0.3 + i*hh*0.3;
    X.beginPath(); X.arc(head.x, ly, lampR, 0, Math.PI*2);
    X.fillStyle = i===onIdx ? aspect : slots[i]; X.fill();
    if (i===onIdx && lampR > 1.5) {
      X.globalAlpha = 0.28; X.beginPath();
      X.arc(head.x, ly, lampR*2.6, 0, Math.PI*2); X.fillStyle = aspect; X.fill();
      X.globalAlpha = 1;
    }
  }
}

// 勾配標: a short post at each change of gradient; its arm points up or down
// the slope that begins there, with the ‰ figure on it (L = level).
function drawGradePost(z, g) {
  const base = CAM.project(-2.35, 0, z), top = CAM.project(-2.35, 1.15, z), s = base.s;
  if (s < 1.5) return;
  X.fillStyle = haze(z, 226, 226, 220);
  X.fillRect(base.x - 0.05*s, top.y, Math.max(1, 0.10*s), base.y - top.y);
  const tilt = g === 0 ? 0 : (g > 0 ? -1 : 1)*0.22*s;      // arm rises on a climb
  X.strokeStyle = haze(z, 236, 236, 230); X.lineWidth = Math.max(1, 0.12*s); X.lineCap = 'butt';
  X.beginPath(); X.moveTo(top.x, top.y + 0.1*s); X.lineTo(top.x + 0.7*s, top.y + 0.1*s + tilt); X.stroke();
  if (s > 18) {
    X.textBaseline = 'middle';
    text(g === 0 ? 'L' : String(Math.abs(g)), top.x + 0.42*s, top.y - 0.16*s + tilt*0.6,
         `bold ${Math.floor(0.24*s)}px monospace`, haze(z, 30, 30, 34), 'center');
    X.textBaseline = 'alphabetic';
  }
}

function drawLineside() {
  const lp = loopPos(S.train.position);
  const dist = distanceToNextStation(S.train.position);
  const aspect = dist < 250 ? '#ff3b30' : dist < 700 ? '#ffcc00' : '#34c759';
  const items = [];
  for (const st of STATIONS) {
    // home signal 520 m out — but on short sections (日暮里 is 500 m) keep it
    // clear of the previous platform, just past its end
    const prev = STATIONS[(st.id + STATIONS.length - 1) % STATIONS.length];
    const sec = (st.pos - prev.pos + TOTAL_LOOP) % TOTAL_LOOP;
    let gp = st.pos - Math.min(520, sec - 60); if (gp < 0) gp += TOTAL_LOOP;
    let gz = gp - lp;      if (gz < 0)  gz += TOTAL_LOOP;
    if (gz > CAM.NEAR && gz < 300) items.push({z:gz, sig:true});
  }
  for (const c of CURVES) {
    const l = curveLimitOf(c[2]);
    if (l >= 90) continue;
    for (const pk of [[c[0], l], [c[1], 90]]) {   // entrance board, then 解除
      let z = pk[0] - lp; if (z < 0) z += TOTAL_LOOP;
      if (z > CAM.NEAR && z < 300) items.push({z:z, lim:pk[1]});
    }
  }
  for (let i = 0; i < PROFILE.length - 1; i++) {
    let z = PROFILE[i][0] - lp; if (z < 0) z += TOTAL_LOOP;
    const g = Math.round((PROFILE[i+1][1]-PROFILE[i][1])/(PROFILE[i+1][0]-PROFILE[i][0])*1000);
    if (z > CAM.NEAR && z < 200) items.push({z: z, grade: g});
  }
  // into the display list, so a train further off can't paint over a nearer sign
  for (const it of items)
    DL.push({z: it.z, pr: 0, f: () => it.sig ? drawSignal(it.z, aspect) : it.grade !== undefined ? drawGradePost(it.z, it.grade) : drawSpeedSign(it.z, it.lim)});
}

// ============================================================
// SCENE: E235 TRAINS & DEPTH-SORTED DISPLAY LIST
// Platforms and trains both stretch hundreds of metres in depth, so
// neither can simply be painted after the other. Both push small
// depth chunks onto DL; dlFlush() paints everything far -> near.
// On ties, pr breaks toward the laterally-farther object (platform).
// ============================================================
const DL = [];
function dlFlush() {
  DL.sort((a,b) => b.z - a.z || a.pr - b.pr);
  for (const it of DL) { LAMP = !!it.lamp; it.f(); }
  LAMP = false;
  DL.length = 0;
}

// E235系: silver body, huge black front window crowned uguisu-green,
// and green painted VERTICALLY on the doors (the waist band moved there
// when platform doors started hiding it).
function drawE235(ox, zF, L, parked) {
  // Trains on the ADJACENT track stay in view far closer than CAM.NEAR —
  // clipping them at 7 m leaves a see-through hole while they pass, so
  // draw their bodywork almost to the camera plane.
  const zN = Math.max(0.8, zF), zE = Math.min(FAR, zF + L);
  if (zE <= zN) return;
  const near = ox > 0 ? ox - 1.42 : ox + 1.42;   // body side facing the camera
  const acx  = ox > 0 ? ox - 0.75 : ox + 0.75;   // near face of roof boxes
  const k = lit(ox > 0 ? 'l' : 'r');                // the side facing us, in sun or shade
  const body = (parked ? [148,152,156] : [206,210,214]).map(c => c*k);
  const green= (parked ? [110,150,44]  : [154,205,50]).map(c => c*k);
  const CAR = 20;
  for (let z1 = zE; z1 > zN; ) {                 // 18 m chunks, far -> near
    // zb is captured by the closure — z1 mutates before DL is flushed
    const zb = z1, z0 = Math.max(zN, z1 - 18), zm = (z0+zb)/2;
    DL.push({z: zb, pr: 1, f: () => {
      wall(near, 0.30, 3.66, z0, zb, haze(zm, body[0], body[1], body[2]));   // body side
      wall(near, 0.30, 0.62, z0, zb, haze(zm, 64, 66, 70));                  // underframe
      wall(near, 2.25, 3.05, z0, zb, haze(zm, 38, 42, 48));                  // window band
      // per-car details, anchored to the trainset
      for (let c = Math.floor((z0-zF)/CAR); c <= Math.ceil((zb-zF)/CAR); c++) {
        const zc = zF + c*CAR;
        if (c > 0 && zc > z0 && zc < zb)
          wall(near, 0.30, 3.66, zc-0.12, zc+0.12, haze(zm, 96, 98, 102));   // car-end gap
        for (const zg of [zc+1.6, zc+18.4])                                  // bogies
          if (zg > z0 && zg < zb) wall(near, 0.30, 0.92, zg-1.1, zg+1.1, haze(zm, 40, 42, 46));
        for (const doff of [3.2, 7.9, 12.6, 17.3]) {                         // 4 green door pairs
          const zd = zc + doff;
          if (zd > z0 && zd < zb) {
            wall(near, 0.55, 3.05, zd-0.65, zd+0.65, haze(zm, green[0], green[1], green[2]));
            wall(near, 2.28, 2.98, zd-0.42, zd+0.42, haze(zm, 42, 48, 52));  // door windows
          }
        }
        const za = zc + 7.2;                                                 // roof AC unit
        if (za > z0 && za+3.4 < zb) {
          wall(acx, 3.95, 4.12, za, za+3.4, haze(zm, 118, 122, 126));
          slab(ox-0.75, ox+0.75, 4.12, za, za+3.4, haze(zm, 136, 140, 144));
        }
      }
      wall(near, 3.55, 3.66, z0, zb, haze(zm, green[0], green[1], green[2])); // cant-rail line
      slab(ox-1.42, ox+1.42, 3.95, z0, zb, haze(zm, 112, 116, 120));          // roof underside
      if (!parked) {                                                          // pantographs, raised
        for (let c = Math.floor((z0-zF)/CAR); c <= Math.ceil((zb-zF)/CAR); c++) {
          if ((c%3)!==1) continue;
          const zp = zF + c*CAR + 10;
          if (zp < z0 || zp > zb) continue;
          const a = CAM.project(ox+0.8, 3.95, zp), b = CAM.project(ox-0.1, 4.55, zp),
                cc = CAM.project(ox+0.45, 5.02, zp);
          X.strokeStyle = haze(zp, 58, 62, 66); X.lineWidth = Math.max(1, 0.05*a.s);
          X.beginPath(); X.moveTo(a.x,a.y); X.lineTo(b.x,b.y); X.lineTo(cc.x,cc.y); X.stroke();
          const h1 = CAM.project(ox-0.10, 5.02, zp), h2 = CAM.project(ox+1.0, 5.02, zp);
          X.beginPath(); X.moveTo(h1.x,h1.y); X.lineTo(h2.x,h2.y); X.stroke();
        }
      }
    }});
    z1 = z0;
  }
  if (zF > CAM.NEAR) DL.push({z: zF+0.05, pr: 1, f: () => {   // cab front
    face(ox-1.45, ox+1.45, 0.25, 3.75, zF, haze(zF, 232, 234, 236));  // white face
    face(ox-1.42, ox+1.42, 3.75, 3.95, zF, haze(zF, 150, 154, 158));  // roof cap
    face(ox-1.18, ox+1.18, 1.55, 3.62, zF, haze(zF, 22, 26, 30));     // the big black window
    face(ox-1.18, ox+1.18, 3.30, 3.62, zF, haze(zF, green[0], green[1], green[2])); // green crown
    face(ox-0.42, ox+0.42, 2.92, 3.22, zF, haze(zF, 244, 168, 70));   // destination LED
    face(ox-1.30, ox+1.30, 0.05, 0.60, zF, haze(zF, 72, 76, 80));     // skirt
    if (!parked) {
      X.fillStyle = '#ffedb0';
      for (const lx of [ox-0.92, ox+0.92]) {
        const l = CAM.project(lx, 1.82, zF);
        X.beginPath(); X.arc(l.x, l.y, Math.max(1.2, 0.15*l.s), 0, Math.PI*2); X.fill();
      }
    }
  }});
}

// Opposing services on the adjacent track, circulating the other way.
const OPP_N = 8, OPP_LEN = 160, OPP_SPEED = 15;   // 8両編成, m/s
function drawOncoming() {
  const lp = loopPos(S.train.position);
  const t = S.worldTime || 0;
  for (let i=0;i<OPP_N;i++) {
    let p = (700 + i*(TOTAL_LOOP/OPP_N) - t*OPP_SPEED) % TOTAL_LOOP;
    if (p < 0) p += TOTAL_LOOP;
    let z = p - lp;
    if (z < -TOTAL_LOOP/2) z += TOTAL_LOOP;
    if (z >  TOTAL_LOOP/2) z -= TOTAL_LOOP;
    if (z + OPP_LEN < 0.5 || z > FAR) continue;
    drawE235(OPP_X, z, OPP_LEN, false);
  }
}

// 東京総合車両センター (品川—大崎間) — stabled rakes beyond the fence, on the
// left for 外回り and the right for 内回り (ROUTE sets YARD and YARD_SIDE).
const YARD = [500, 1600];
let YARD_SIDE = -1;
function drawYard() {
  const lp = loopPos(S.train.position);
  for (let t=3; t>=0; t--) {                     // outermost siding first
    const sx = YARD_SIDE*(8.5 + t*4.2);
    const s0 = YARD[0] + 90 + t*130, len = 160 - t*20;
    const zF = s0 - lp;
    if (zF + len < 0.5 || zF > FAR) continue;
    drawE235(sx, zF, len, true);
  }
}

// SCENE: STATIONS
